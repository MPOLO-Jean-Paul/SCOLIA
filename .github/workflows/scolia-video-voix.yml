name: SCOLIA - voix de la video de presentation

# Lit la narration de la vidéo de présentation avec deux voix françaises Piper (licences libres)
# et publie les fichiers WAV sur une branche video/voix-<run>.
on:
  push:
    branches: ['video/presentation-*']
    paths:
      - 'scolia-pro/scripts/video/**'
      - '.github/workflows/scolia-video-voix.yml'
  workflow_dispatch:
    inputs:
      moteur:
        description: 'piper ou kyutai'
        default: 'kyutai'

permissions:
  contents: write

jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Nouvelle voix féminine (Kyutai TTS, CC BY 4.0), voix masculine conservée
        timeout-minutes: 300
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "moshi==0.2.11" sphn huggingface_hub openai-whisper
          git fetch -q origin video/voix-42758454327 && mkdir -p sortie && git --work-tree=sortie checkout FETCH_HEAD -- .
          rm -f sortie/*-elle.wav
          python -u scolia-pro/scripts/video/voix_elle.py sortie
      - name: Publier les voix
        run: |
          cd sortie
          git init -q && git checkout -q -b voix
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Voix de la video (${GITHUB_SHA})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voix:refs/heads/video/voix-${{ github.run_id }}
