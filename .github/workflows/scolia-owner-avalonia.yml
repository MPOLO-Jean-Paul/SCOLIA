name: SCOLIA Console natif Avalonia - Android et Windows

on:
  push:
    branches: [feature/jp-services-admin-server-discovery-20261109]
    paths:
      - 'scolia-pro/owner-app/avalonia/**'
      - '.github/workflows/scolia-owner-avalonia.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scolia-owner-avalonia-${{ github.ref }}
  cancel-in-progress: false

env:
  OWNER_VERSION: '1.1.1'

jobs:
  windows:
    name: Windows - Executable et installateur Avalonia
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compiler la vraie fenetre native Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish 'scolia-pro/owner-app/avalonia/Desktop/Scolia.Owner.Desktop.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o "$env:RUNNER_TEMP/owner-avalonia-publish"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP/owner-avalonia-publish/SCOLIA-Console.exe")) { throw "Fichier EXE Avalonia absent" }
      - name: Installer Inno Setup si necessaire
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup introuvable" }
      - name: Produire le programme d'installation
        shell: pwsh
        working-directory: scolia-pro/owner-app/avalonia/Desktop
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OWNER_PUBLISH_DIR = "$env:RUNNER_TEMP/owner-avalonia-publish"
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'Installer.Avalonia.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $file = Get-ChildItem 'installer-output/*.exe' | Select-Object -First 1
          if (-not $file -or $file.Length -lt 100000) { throw "Installateur invalide" }
      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA-Admin-Avalonia-Windows-PREVIEW
          path: scolia-pro/owner-app/avalonia/Desktop/installer-output/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android - APK Avalonia natif
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer le workload officiel .NET Android
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install android --skip-manifest-update
      - name: Installer les dependances Android
        shell: bash
        run: |
          set -euo pipefail
          project='scolia-pro/owner-app/avalonia/Android/Scolia.Owner.Android.csproj'
          dotnet build "$project" -t:InstallAndroidDependencies -f net10.0-android \
            -p:AcceptAndroidSDKLicenses=True \
            "-p:AndroidSdkDirectory=$ANDROID_HOME" "-p:JavaSdkDirectory=$JAVA_HOME"
      - name: Compiler l'APK natif signe pour test
        shell: bash
        run: |
          set -euo pipefail
          project='scolia-pro/owner-app/avalonia/Android/Scolia.Owner.Android.csproj'
          dotnet publish "$project" -c Debug -f net10.0-android -r android-arm64 \
            -p:AndroidPackageFormat=apk \
            "-p:AndroidSdkDirectory=$ANDROID_HOME" "-p:JavaSdkDirectory=$JAVA_HOME"
          mkdir -p "$RUNNER_TEMP/scolia-avalonia-apk"
          mapfile -t apks < <(find scolia-pro/owner-app/avalonia/Android/bin/Debug -type f -name '*.apk' | sort)
          if [[ "${#apks[@]}" -eq 0 ]]; then
            echo '::error::Aucun APK Avalonia genere'
            exit 1
          fi
          cp "${apks[0]}" "$RUNNER_TEMP/scolia-avalonia-apk/SCOLIA_Console_Avalonia_1.1.1_Android_PREVIEW.apk"
          test -s "$RUNNER_TEMP/scolia-avalonia-apk/SCOLIA_Console_Avalonia_1.1.1_Android_PREVIEW.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA-Admin-Avalonia-Android-PREVIEW
          path: ${{ runner.temp }}/scolia-avalonia-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  console-tests:
    name: Tests de sécurité et du répertoire des serveurs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scolia-pro/deploy/owner-console
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exécuter les tests du Worker
        run: npm test

  smoke-android:
    name: Vérifier que SCOLIA Console reste ouverte sur émulateur Android
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Préparer .NET Android et le SDK
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install android --skip-manifest-update
          project='scolia-pro/owner-app/avalonia/Android/Scolia.Owner.Android.csproj'
          dotnet build "$project" -t:InstallAndroidDependencies -f net10.0-android \
            -p:AcceptAndroidSDKLicenses=True \
            "-p:AndroidSdkDirectory=$ANDROID_HOME" "-p:JavaSdkDirectory=$JAVA_HOME"
      - name: Compiler l'APK x64 pour l'émulateur
        shell: bash
        run: |
          set -euo pipefail
          project='scolia-pro/owner-app/avalonia/Android/Scolia.Owner.Android.csproj'
          dotnet publish "$project" -c Debug -f net10.0-android -r android-x64 \
            -p:AndroidPackageFormat=apk \
            "-p:AndroidSdkDirectory=$ANDROID_HOME" "-p:JavaSdkDirectory=$JAVA_HOME"
          mkdir -p "$RUNNER_TEMP/smoke"
          mapfile -t apks < <(find scolia-pro/owner-app/avalonia/Android/bin/Debug \
            -type f -name '*Signed.apk' | sort)
          if [[ "${#apks[@]}" -eq 0 ]]; then
            echo '::error::Aucun APK de test signé x64 disponible.'
            exit 1
          fi
          cp "${apks[0]}" "$RUNNER_TEMP/smoke/SCOLIA-Console-android-x64.apk"
      - name: Démarrer réellement l'application Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r "$RUNNER_TEMP/smoke/SCOLIA-Console-android-x64.apk"
            adb logcat -c
            # Exécuter la commande de lancement EN UNE SEULE LIGNE :
            # la version précédente échouait sur « Count not specified ».
            adb shell monkey -p com.jpservices.scolia.owner.preview -c android.intent.category.LAUNCHER 1
            sleep 12
            pid="$(adb shell pidof com.jpservices.scolia.owner.preview | tr -d '\r')"
            if [[ -z "$pid" ]]; then
              adb logcat -d -t 1500 | grep -E 'AndroidRuntime|FATAL EXCEPTION|scolia.owner' | tail -100 || true
              echo '::error::SCOLIA Console se ferme après le lancement.'
              exit 1
            fi
            echo "SCOLIA Console ouverte sur émulateur Android (PID: $pid)."

  preview:
    name: Publier pilote Avalonia Android + Windows
    needs: [android, windows, smoke-android, console-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SCOLIA-Admin-Avalonia-Windows-PREVIEW
          path: distribution/windows
      - uses: actions/download-artifact@v4
        with:
          name: SCOLIA-Admin-Avalonia-Android-PREVIEW
          path: distribution/android
      - name: Publication en preversion distincte
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(distribution/windows/*.exe)
          apks=(distribution/android/*.apk)
          if [[ "${#installers[@]}" -ne 1 || "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Executables incomplets"
            exit 1
          fi
          test -s "${installers[0]}"
          test -s "${apks[0]}"
          tag="scolia-console-avalonia-preview-v1.1.1-${GITHUB_SHA:0:8}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Cette preversion est deja publiee.'
            exit 0
          fi
          gh release create "$tag" "${installers[0]}" "${apks[0]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'SCOLIA Console 1.1.1 - Avalonia natif Android et Windows (PREVIEW)' \
            --prerelease \
            --notes "Pilote natif Avalonia 12 partage entre Android et Windows, sans WebView. Les fonctions sensibles ouvrent pour l'instant la console Cloudflare Access dans le navigateur systeme afin de respecter la MFA. APK signe par certificat de test : il ne remplace pas une version de production. L'EXE Windows n'est pas signe Authenticode. Canal JP-Services independant des clients."
