name: SCOLIA Phone iPhone - IPA signe

# Livraison d'un IPA pour appareil reel uniquement sur action explicite.
# Les certificats Apple ne sont jamais utilises par les runs push/pull_request.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Distribution du profil Apple : Ad Hoc pour appareils inscrits, App Store pour TestFlight'
        required: true
        type: choice
        default: ad-hoc
        options:
          - ad-hoc
          - app-store

permissions:
  contents: read

concurrency:
  group: scolia-phone-ipa-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: scolia-pro

jobs:
  ipa-signe:
    name: SCOLIA iOS - signature et verification de l'IPA
    runs-on: xcode-27
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: scolia-pro/global.json

      - name: Verifier les tests du protocole de signature
        run: python3 -m unittest discover -s scripts -p test_ios_signing.py -v

      - name: Verifier la presence des secrets Apple
        shell: bash
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.SCOLIA_IOS_CERT_P12_BASE64 }}
          IOS_CERT_P12_PASSWORD: ${{ secrets.SCOLIA_IOS_CERT_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.SCOLIA_IOS_PROFILE_BASE64 }}
          IOS_CODESIGN_KEY: ${{ secrets.SCOLIA_IOS_CODESIGN_KEY }}
        run: |
          set -euo pipefail
          for name in IOS_CERT_P12_BASE64 IOS_CERT_P12_PASSWORD IOS_PROFILE_BASE64 IOS_CODESIGN_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret Apple manquant : $name. Consultez src/Scolia.Phone.iOS/README.md."
              exit 1
            fi
          done

      - name: Installer les outils iOS et verifier Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          dotnet --version
          dotnet workload install ios

      - name: Installer le certificat et le profil dans un trousseau temporaire
        id: install-signing
        shell: bash
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.SCOLIA_IOS_CERT_P12_BASE64 }}
          IOS_CERT_P12_PASSWORD: ${{ secrets.SCOLIA_IOS_CERT_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.SCOLIA_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          cert="$RUNNER_TEMP/scolia-apple-distribution.p12"
          profile="$RUNNER_TEMP/scolia.mobileprovision"
          keychain="$RUNNER_TEMP/scolia-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$IOS_CERT_P12_BASE64" | base64 --decode > "$cert"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$profile"
          test -s "$cert" && test -s "$profile"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -P "$IOS_CERT_P12_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$cert"
          echo "IOS_SIGNING_PROFILE_PATH=$profile" >> "$GITHUB_ENV"
          echo "IOS_SIGNING_KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      - name: Refuser un mauvais profil ou une signature Apple non correspondante
        shell: bash
        env:
          IOS_CODESIGN_KEY: ${{ secrets.SCOLIA_IOS_CODESIGN_KEY }}
          IOS_PROFILE_NAME: ${{ secrets.SCOLIA_IOS_PROFILE_NAME }}
          SELECTED_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          python3 scripts/ios_signing.py \
            --profile "$IOS_SIGNING_PROFILE_PATH" \
            --keychain "$IOS_SIGNING_KEYCHAIN_PATH" \
            --bundle-id com.jpservices.scolia.ios \
            --codesign-key "$IOS_CODESIGN_KEY" \
            --channel "$SELECTED_CHANNEL" \
            --expected-profile-name "$IOS_PROFILE_NAME" \
            --github-env "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$IOS_SIGNING_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"

      - name: Generer un IPA signe pour iPhone et iPad
        shell: bash
        env:
          IOS_CODESIGN_KEY: ${{ secrets.SCOLIA_IOS_CODESIGN_KEY }}
        run: |
          set -euo pipefail
          dotnet publish src/Scolia.Phone.iOS/Scolia.Phone.iOS.csproj \
            -c Release -f net10.0-ios -r ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:EnableCodeSigning=true \
            -p:CodesignKey="$IOS_CODESIGN_KEY" \
            -p:CodesignProvision="$IOS_PROFILE_UUID"

      - name: Verifier signature, identifiant, architecture et integrite de l'IPA
        shell: bash
        run: |
          set -euo pipefail
          directory="src/Scolia.Phone.iOS/bin/Release/net10.0-ios/ios-arm64/publish"
          test -d "$directory" || { echo '::error::Publication iOS absente.'; exit 1; }
          ipa="$(find "$directory" -maxdepth 2 -name '*.ipa' -type f -print -quit)"
          if [[ -z "$ipa" || ! -s "$ipa" ]]; then
            echo '::error::Aucun vrai fichier .ipa genere ; aucun livrable iPhone ne sera publie.'
            exit 1
          fi
          unzip -tqq "$ipa"
          tmp="$(mktemp -d)"
          unzip -q "$ipa" -d "$tmp"
          app="$(find "$tmp/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          [[ -n "$app" ]] || { echo '::error::Archive sans application iOS dans Payload.'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          [[ "$bundle" == 'com.jpservices.scolia.ios' ]] || { echo '::error::Identifiant de l’application iOS incorrect.'; exit 1; }
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")"
          [[ -f "$app/$executable" ]] || { echo '::error::Binaire iOS manquant.'; exit 1; }
          lipo -archs "$app/$executable" | grep -Eq '(^| )arm64( |$)' || { echo '::error::Binaire iPhone arm64 absent.'; exit 1; }
          [[ -f "$app/embedded.mobileprovision" ]] || { echo '::error::Profil de distribution non inclus.'; exit 1; }
          security cms -D -i "$app/embedded.mobileprovision" > "$RUNNER_TEMP/scolia-embedded-profile.plist"
          embedded_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/scolia-embedded-profile.plist")"
          [[ "$embedded_uuid" == "$IOS_PROFILE_UUID" ]] || { echo '::error::Profil signe different du profil valide.'; exit 1; }
          mkdir -p artifacts/ios-signe
          cp "$ipa" artifacts/ios-signe/SCOLIA_Phone_iPhone_iOS_Signed.ipa
          (
            cd artifacts/ios-signe
            shasum -a 256 SCOLIA_Phone_iPhone_iOS_Signed.ipa > SCOLIA_Phone_iPhone_iOS_Signed.ipa.sha256
          )
          if [[ "$IOS_DISTRIBUTION_CHANNEL" == 'ad-hoc' ]]; then
            printf '%s\n' 'IPA Ad Hoc signe et verifie : seulement pour les appareils inclus dans le profil Apple. Installation via Apple Configurator / Xcode.' > artifacts/ios-signe/LIRE_MOI.txt
          else
            printf '%s\n' 'IPA App Store signe et verifie : televerser vers App Store Connect/TestFlight. Pas d installation directe par simple telechargement.' > artifacts/ios-signe/LIRE_MOI.txt
          fi
          echo 'IPA SCOLIA iOS : signature, profil, identifiant et architecture verifies.'

      - name: Publier uniquement l'IPA reel valide
        uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Phone_iPhone_IPA_Signe
          path: scolia-pro/artifacts/ios-signe/
          if-no-files-found: error
          retention-days: 30

      - name: Supprimer le trousseau et les fichiers de signature
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/scolia.mobileprovision" "$RUNNER_TEMP/scolia-apple-distribution.p12" "$RUNNER_TEMP/scolia-embedded-profile.plist"
          if [[ -f "$RUNNER_TEMP/scolia-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/scolia-signing.keychain-db"
          fi
