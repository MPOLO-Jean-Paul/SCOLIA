name: SCOLIA Flutter - démarrage sur émulateur
on:
  pull_request:
    paths:
      - 'scolia-pro/src/Scolia.Flutter/**'
      - 'scolia-pro/src/Scolia.Flutter.AndroidBinding/**'
      - 'scolia-pro/src/Scolia.Mobile/**'
      - 'scolia-pro/src/Scolia.Bureau/Infrastructure/Flutter*'
      - '.github/workflows/scolia-flutter-device.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCOLIA_FLUTTER_EMULATOR: '1'
    defaults:
      run:
        working-directory: scolia-pro/src/Scolia.Flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
      - run: flutter pub get
      - run: flutter build aar --no-debug --no-profile --target-platform=android-x64
      - run: python3 android_bridge/build_bridge.py
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install android
      - run: dotnet publish ../Scolia.Mobile/Scolia.Mobile.csproj -c Release -p:ScoliaFlutterExperiment=true -p:ScoliaFlutterEmulator=true -p:AndroidKeyStore=false -p:AndroidPackageFormat=apk
      - run: python3 android_bridge/verify_apk.py
      - name: Autoriser KVM sur le runner jetable
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installer et vérifier le démarrage Android réel
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scolia-pro/src/Scolia.Flutter/android_bridge/run_device_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scolia-flutter-emulator-validation
          path: scolia-pro/src/Scolia.Flutter/build/validation/
          if-no-files-found: error
