name: SCOLIA Phone iPhone - compilation de verification

on:
  push:
    paths:
      - 'scolia-pro/src/Scolia.Phone.iOS/**'
      - 'scolia-pro/src/Scolia.Bureau/**'
      - 'scolia-pro/src/Scolia.Transport/**'
      - 'scolia-pro/Directory.Packages.props'
      - '.github/workflows/scolia-phone-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scolia-phone-iphone-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: scolia-pro

jobs:
  simulateur:
    name: SCOLIA Phone iPhone - simulateur non signe
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: scolia-pro/global.json
      - name: Environnement Apple
        run: |
          xcodebuild -version
          dotnet --info
      - name: Installation du SDK iOS
        run: dotnet workload install ios
      - name: Compilation client iOS sans signature (simulateur)
        run: |
          dotnet build src/Scolia.Phone.iOS/Scolia.Phone.iOS.csproj -c Debug -f net10.0-ios -r iossimulator-x64 -p:EnableCodeSigning=false -p:CodesignRequireProvisioningProfile=false
      - name: Archive de verification pour simulateur uniquement
        run: |
          mkdir -p artifacts/ios-simulateur
          find src/Scolia.Phone.iOS/bin/Debug/net10.0-ios -name '*.app' -type d -maxdepth 6 -print -exec cp -R {} artifacts/ios-simulateur/ \;
          find artifacts/ios-simulateur -maxdepth 2 -type d | head
      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Phone_iPhone_Simulateur_NonSigne
          path: scolia-pro/artifacts/ios-simulateur/
          retention-days: 30
          if-no-files-found: error
