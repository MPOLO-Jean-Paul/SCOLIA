name: SCOLIA Phone iPhone - compilation de verification

# Validation sans certificat : chaque changement du code natif est compile par GitHub sur macOS.
on:
  push:
    paths:
      - 'scolia-pro/src/Scolia.Phone.iOS/**'
      - 'scolia-pro/src/Scolia.Bureau/**'
      - 'scolia-pro/src/Scolia.Transport/**'
      - 'scolia-pro/Directory.Packages.props'
      - 'scolia-pro/global.json'
      - 'scolia-pro/scripts/ios_signing.py'
      - 'scolia-pro/scripts/test_ios_signing.py'
      - '.github/workflows/scolia-phone-ios.yml'
      - '.github/workflows/scolia-phone-ipa.yml'
  pull_request:
    paths:
      - 'scolia-pro/src/Scolia.Phone.iOS/**'
      - 'scolia-pro/src/Scolia.Bureau/**'
      - 'scolia-pro/src/Scolia.Transport/**'
      - 'scolia-pro/Directory.Packages.props'
      - 'scolia-pro/global.json'
      - 'scolia-pro/scripts/ios_signing.py'
      - 'scolia-pro/scripts/test_ios_signing.py'
      - '.github/workflows/scolia-phone-ios.yml'
      - '.github/workflows/scolia-phone-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scolia-phone-iphone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: scolia-pro

jobs:
  simulateur:
    name: iOS natif - simulateur Apple Silicon, sans signature
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: scolia-pro/global.json
      - name: Tests des validations de signature Apple (sans secrets)
        run: python3 -m unittest discover -s scripts -p test_ios_signing.py -v
      - name: Identifier l'environnement Apple
        run: |
          xcodebuild -version
          dotnet --info
      - name: Installer les outils iOS .NET 10
        run: dotnet workload install ios
      - name: Compiler l'application native iOS pour le simulateur
        run: |
          dotnet build src/Scolia.Phone.iOS/Scolia.Phone.iOS.csproj \
            -c Debug -f net10.0-ios -r iossimulator-arm64 \
            -p:PublishTrimmed=true \
            -p:EnableCodeSigning=false \
            -p:CodesignRequireProvisioningProfile=false
      - name: Verifier le vrai bundle de simulateur
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios-simulateur
          app="$(find src/Scolia.Phone.iOS/bin/Debug/net10.0-ios -maxdepth 8 -type d -name '*.app' -print -quit)"
          [[ -n "$app" ]] || { echo '::error::Aucune application native iOS dans la compilation.'; exit 1; }
          bundle="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          [[ "$bundle" == 'com.jpservices.scolia.ios' ]] || { echo '::error::Identifiant iOS incoherent.'; exit 1; }
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")"
          test -s "$app/$executable"
          lipo -archs "$app/$executable" | grep -Eq '(^| )arm64( |$)'
          cp -R "$app" artifacts/ios-simulateur/
          printf '%s\n' 'Application Avalonia iOS pour simulateur Apple Silicon, NON SIGNEE et NON INSTALLABLE sur iPhone physique. Utiliser le workflow IPA signe pour les vrais appareils.' > artifacts/ios-simulateur/LIRE_MOI.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Phone_iPhone_Simulateur_NonSigne
          path: scolia-pro/artifacts/ios-simulateur/
          retention-days: 30
          if-no-files-found: error

  ipa-appareil:
    name: iOS natif - IPA iPhone et iPad (arm64), a signer avec votre identifiant Apple
    runs-on: xcode-27
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: scolia-pro/global.json
      - name: Installer les outils iOS .NET 10
        run: dotnet workload install ios
      - name: Compiler pour iPhone et iPad (arm64, Release), sans certificat
        run: |
          dotnet build src/Scolia.Phone.iOS/Scolia.Phone.iOS.csproj \
            -c Release -f net10.0-ios -r ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:CodesignRequireProvisioningProfile=false \
            -p:BuildIpa=false
      - name: Verifier le paquet et assembler l'IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$(find src/Scolia.Phone.iOS/bin/Release/net10.0-ios/ios-arm64 -maxdepth 3 -type d -name '*.app' -print -quit)"
          [[ -n "$app" ]] || { echo '::error::Aucune application iPhone dans la compilation.'; exit 1; }
          plist="$app/Info.plist"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$plist")"
          [[ "$bundle" == 'com.jpservices.scolia.ios' ]] || { echo '::error::Identifiant iOS incoherent.'; exit 1; }
          executable="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist")"
          test -s "$app/$executable"
          lipo -archs "$app/$executable" | grep -Eq '(^| )arm64( |$)' || { echo '::error::Binaire arm64 absent.'; exit 1; }
          platform="$(/usr/libexec/PlistBuddy -c 'Print DTPlatformName' "$plist" 2>/dev/null || echo iphoneos)"
          [[ "$platform" == 'iphoneos' ]] || { echo "::error::Plateforme inattendue : $platform"; exit 1; }
          test -f "$app/Assets.car" || { echo '::error::Icone et ecran de lancement absents (Assets.car).'; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print UILaunchScreen' "$plist" >/dev/null || { echo '::error::Ecran de lancement non declare.'; exit 1; }
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")"
          echo "Application $bundle $version, $(du -sh "$app" | cut -f1)"
          out="$PWD/artifacts/ios-appareil"
          mkdir -p "$out" "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry -X "$out/SCOLIA_Phone_iOS.ipa" Payload)
          unzip -tqq "$out/SCOLIA_Phone_iOS.ipa"
          (cd "$out" && shasum -a 256 SCOLIA_Phone_iOS.ipa > SCOLIA_Phone_iOS.ipa.sha256)
          cat > "$out/LIRE_MOI.txt" <<'TXT'
          SCOLIA Phone pour iPhone et iPad - IPA a signer
          
          Ce fichier contient la vraie application iPhone (arm64, iOS 17 ou plus).
          Apple exige une signature avant toute installation. Elle se fait avec votre
          propre identifiant Apple, sans Mac :
          
          1. Sur un PC Windows ou un Mac, installez Sideloadly (sideloadly.io) et iTunes.
          2. Branchez l'iPhone en USB et faites-lui confiance.
          3. Glissez SCOLIA_Phone_iOS.ipa dans Sideloadly, saisissez votre identifiant
             Apple, puis Start.
          4. Sur l'iPhone : Reglages > General > VPN et gestion de l'appareil >
             votre identifiant > Faire confiance. Activez aussi le Mode developpeur
             si iOS le demande (Reglages > Confidentialite et securite).
          
          Identifiant Apple gratuit : l'application doit etre re-signee tous les 7 jours.
          Compte Apple Developer (99 USD par an) : signature valable un an, ou
          distribution par TestFlight avec le workflow « SCOLIA Phone iPhone - IPA signe ».
          
          L'iPhone se connecte au serveur SCOLIA de l'etablissement (ordinateur ou
          telephone Android serveur) : saisissez son adresse au premier lancement.
          TXT
          sed -i '' 's/^          //' "$out/LIRE_MOI.txt"
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Phone_iPhone_IPA_a_signer
          path: scolia-pro/artifacts/ios-appareil/
          retention-days: 30
          if-no-files-found: error
