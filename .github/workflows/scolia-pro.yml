name: SCOLIA Pro

on:
  push:
    paths: ['scolia-pro/**', '.github/workflows/scolia-pro.yml']
  pull_request:
    paths: ['scolia-pro/**', '.github/workflows/scolia-pro.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scolia-pro-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: scolia-pro

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  qualite:
    name: Compilation et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: scolia-pro/global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            scolia-pro/web/package-lock.json
            scolia-pro/e2e/package-lock.json

      - name: Interface web (types, tests, compilation)
        working-directory: scolia-pro/web
        run: |
          npm ci --no-audit --no-fund
          npx vitest run
          npm run build

      - name: Serveur (compilation stricte, avertissements bloquants)
        run: dotnet build Scolia.sln -c Release

      - name: Tests du domaine et de l'API
        run: dotnet test Scolia.sln -c Release --no-build --logger "trx;LogFileName=resultats.trx"

      - name: Migrations à jour avec le modèle
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Scolia.Infrastructure --startup-project src/Scolia.Infrastructure

      - name: Parcours de bout en bout (Playwright)
        working-directory: scolia-pro/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapports-de-tests
          path: |
            scolia-pro/e2e/playwright-report
            scolia-pro/e2e/test-results
            scolia-pro/tests/**/TestResults

  paquet-android:
    name: Application Android
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: scolia-pro/global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Outils Android (.NET et SDK)
        run: |
          dotnet workload install android
          dotnet build src/Scolia.Mobile -t:InstallAndroidDependencies -f net10.0-android \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Compilation et signature de l'APK
        env:
          SCOLIA_ANDROID_KEYSTORE: ${{ secrets.SCOLIA_ANDROID_KEYSTORE }}
          SCOLIA_KEYSTORE_PASS: ${{ secrets.SCOLIA_ANDROID_KEYSTORE_PASS }}
        run: |
          # Clé de l'établissement si elle est fournie dans les secrets du dépôt, sinon clé de développement.
          if [ -n "$SCOLIA_ANDROID_KEYSTORE" ]; then
            echo "$SCOLIA_ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/scolia.keystore"
            export SCOLIA_KEYSTORE="$RUNNER_TEMP/scolia.keystore"
          fi
          export JavaSdkDirectory="$JAVA_HOME"
          bash scripts/publier-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Pro_Android
          path: scolia-pro/artifacts/android/
          retention-days: 30

  paquet-windows:
    name: Paquet Windows
    needs: [qualite, paquet-android]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: scolia-pro/global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scolia-pro/web/package-lock.json

      - name: Application Android à joindre au paquet
        uses: actions/download-artifact@v5
        with:
          name: SCOLIA_Pro_Android
          path: scolia-pro/artifacts/android

      - name: Publication autonome (un seul exécutable)
        shell: pwsh
        run: ./scripts/publier-windows.ps1

      - name: Démarrage réel de SCOLIA.exe
        shell: pwsh
        run: |
          $env:Scolia__Reseau__Port = '5280'
          $env:Scolia__OuvrirNavigateur = 'false'
          $env:Scolia__Stockage__DataDirectory = Join-Path $env:RUNNER_TEMP 'scolia-donnees'
          $process = Start-Process -FilePath artifacts/SCOLIA/SCOLIA.exe -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
              Start-Sleep -Milliseconds 500
              try { $ok = (Invoke-WebRequest http://localhost:5280/api/sante -UseBasicParsing).StatusCode -eq 200 } catch { }
            }
            if (-not $ok) { throw 'SCOLIA.exe ne répond pas.' }
            $page = Invoke-WebRequest http://localhost:5280/ -UseBasicParsing
            if ($page.Content -notmatch 'SCOLIA') { throw "L'interface n'est pas servie." }
            Write-Host "SCOLIA.exe démarré et opérationnel."
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Pro_Windows_x64
          path: |
            scolia-pro/artifacts/*.zip
            scolia-pro/artifacts/*.sha256
            scolia-pro/artifacts/android/*.apk
          retention-days: 30
