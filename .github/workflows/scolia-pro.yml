name: SCOLIA Pro

on:
  push:
    paths: ['scolia-pro/**', '.github/workflows/scolia-pro.yml']
  pull_request:
    paths: ['scolia-pro/**', '.github/workflows/scolia-pro.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scolia-pro-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: scolia-pro

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  qualite:
    name: Compilation et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        id: dotnet
        continue-on-error: true
        with:
          global-json-file: scolia-pro/global.json
      - name: .NET de secours
        if: steps.dotnet.outcome == 'failure'
        run: bash scripts/installer-dotnet.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            scolia-pro/web/package-lock.json
            scolia-pro/e2e/package-lock.json

      - name: Interface web (types, tests, compilation)
        working-directory: scolia-pro/web
        run: |
          npm ci --no-audit --no-fund
          npx vitest run
          npm run build

      - name: Serveur (compilation stricte, avertissements bloquants)
        run: |
          dotnet build Scolia.sln -c Release
          dotnet build tests/Scolia.Bureau.Captures -c Release

      # Captures natives de l'accueil Power BI : donnees fictives, sans serveur scolaire.
      - name: Accueil Power BI - Windows 11 (formats et themes)
        env:
          SCOLIA_ASTUCES: '0'
        run: |
          SCOLIA_MOBILE=0 dotnet run --no-build --project tests/Scolia.Bureau.Captures -c Release -- artifacts/accueil-powerbi/windows http://127.0.0.1:5293/ Scolia2026! accueil-powerbi
          SCOLIA_MOBILE=1 SCOLIA_TAILLE=390x740 dotnet run --no-build --project tests/Scolia.Bureau.Captures -c Release -- artifacts/accueil-powerbi/android http://127.0.0.1:5293/ Scolia2026! accueil-powerbi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCOLIA_Pro_Accueil_PowerBI_Windows11
          path: scolia-pro/artifacts/accueil-powerbi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Identite de connexion - compte reconnu et cercles superposes
        env:
          SCOLIA_ASTUCES: '0'
        run: |
          SCOLIA_MOBILE=0 SCOLIA_TAILLE=1280x820 dotnet run --no-build --project tests/Scolia.Bureau.Captures -c Release -- artifacts/identite-connexion/windows http://127.0.0.1:5293/ inutilise identite-connexion
          SCOLIA_MOBILE=1 SCOLIA_TAILLE=390x740 dotnet run --no-build --project tests/Scolia.Bureau.Captures -c Release -- artifacts/identite-connexion/android http://127.0.0.1:5293/ inutilise identite-connexion
          SCOLIA_MOBILE=1 SCOLIA_TAILLE=390x740 SCOLIA_CAPTURE_DARK=1 dotnet run --no-build --project tests/Scolia.Bureau.Captures -c Release -- artifacts/identite-connexion/android-sombre http://127.0.0.1:5293/ inutilise identite-connexion

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCOLIA_Identite_Connexion_Windows_Android
          path: scolia-pro/artifacts/identite-connexion/
          if-no-files-found: ignore
          retention-days: 14

      # Premier accueil : captures natives autonomes, Windows et téléphone.
      - name: Premiere configuration - profils et cycles scolaires
        env:
          SCOLIA_ASTUCES: '0'
        run: |
          SCOLIA_MOBILE=0 SCOLIA_TAILLE=1280x820 dotnet run --no-build --project tests/Scolia.Bureau.Captures -c Release -- artifacts/premiere-configuration/windows http://127.0.0.1:5293/ Scolia2026! premiere-configuration
          SCOLIA_MOBILE=1 SCOLIA_TAILLE=390x740 dotnet run --no-build --project tests/Scolia.Bureau.Captures -c Release -- artifacts/premiere-configuration/android http://127.0.0.1:5293/ Scolia2026! premiere-configuration

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCOLIA_Premiere_Configuration_Windows_Android
          path: scolia-pro/artifacts/premiere-configuration/
          if-no-files-found: ignore
          retention-days: 14

      # Revue UI des cartes : donnees fictives, moteur d'export reel non touche.
      # Les captures sont seulement celles des ecrans, jamais les PDF scolaires.
      - name: Cartes - mise en page desktop et mobile sans modifier le modele
        env:
          SCOLIA_ASTUCES: '0'
        run: |
          for layout in 0 1; do
            SCOLIA_MOBILE="$layout" dotnet run --no-build --project tests/Scolia.Bureau.Captures -c Release -- artifacts/cartes-ui/$layout http://127.0.0.1:5293/ Scolia2026! cartes-ui
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCOLIA_Pro_Cartes_Interfaces_Windows_Android
          path: scolia-pro/artifacts/cartes-ui/
          if-no-files-found: ignore
          retention-days: 7

      - name: Relais longue distance (publication autonome Linux)
        run: dotnet publish src/Scolia.Relay -c Release --no-restore -o artifacts/relais

      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Pro_Relais_Linux
          path: scolia-pro/artifacts/relais/
          retention-days: 30

      - name: Sources complètes et état de référence
        run: |
          python3 -m unittest discover -s tests -p 'test_source_archive.py'
          python3 scripts/archiver-sources.py artifacts/SCOLIA_Pro_Sources.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Pro_Sources
          path: |
            scolia-pro/artifacts/SCOLIA_Pro_Sources.zip
            scolia-pro/artifacts/SCOLIA_Pro_Sources.sha256
          retention-days: 30

      - name: Tests du domaine et de l'API
        run: dotnet test Scolia.sln -c Release --no-build --logger "trx;LogFileName=resultats.trx"

      - name: Interfaces natives mobiles (paiements, menus, actualisation, petits écrans et clavier)
        env:
          SCOLIA_MOBILE: '1'
          SCOLIA_ASTUCES: '0'
        run: dotnet run --no-build --project tests/Scolia.Bureau.Captures -c Release -- artifacts/fluidite http://127.0.0.1:5293/ Scolia2026! fluidite

      - name: Ecrans AVANT connexion Android — aucun defilement, positions mesurees
        env:
          SCOLIA_MOBILE: '1'
          SCOLIA_ASTUCES: '0'
        run: dotnet run --no-build --project tests/Scolia.Bureau.Captures -c Release -- artifacts/preconnexion http://127.0.0.1:5293/ Scolia2026! connexion-compacte

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCOLIA_Pro_Android_Preconnexion
          path: scolia-pro/artifacts/preconnexion/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCOLIA_Pro_Mobile_Interfaces
          path: scolia-pro/artifacts/fluidite/
          if-no-files-found: ignore
          retention-days: 7

      - name: Interfaces natives bureau (paiements, tailles, texte agrandi et dialogues)
        env:
          SCOLIA_MOBILE: '0'
          SCOLIA_ASTUCES: '0'
        run: dotnet run --no-build --project tests/Scolia.Bureau.Captures -c Release -- artifacts/bureau http://127.0.0.1:5293/ Scolia2026! bureau

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCOLIA_Pro_Desktop_Interfaces
          path: scolia-pro/artifacts/bureau/
          if-no-files-found: ignore
          retention-days: 7

      - name: Thème sombre natif (contrastes, six accents, changement de thème, mobile et bureau)
        env:
          SCOLIA_ASTUCES: '0'
        run: |
          for layout in 1 0; do
            SCOLIA_MOBILE="$layout" dotnet run --no-build --project tests/Scolia.Bureau.Captures -c Release -- artifacts/contraste/$layout http://127.0.0.1:5293/ Scolia2026! contraste
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCOLIA_Pro_Theme_Sombre_Interfaces
          path: scolia-pro/artifacts/contraste/
          if-no-files-found: ignore
          retention-days: 7

      - name: Migrations à jour avec le modèle
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Scolia.Infrastructure --startup-project src/Scolia.Infrastructure

      - name: Parcours de bout en bout (Playwright)
        working-directory: scolia-pro/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapports-de-tests
          path: |
            scolia-pro/e2e/playwright-report
            scolia-pro/e2e/test-results
            scolia-pro/tests/**/TestResults

  paquet-android:
    name: Application Android
    needs: qualite
    runs-on: ubuntu-latest
    outputs:
      # Vrai seulement pour un APK signe avec le certificat officiel (secrets, ou PR #18).
      officiel: ${{ steps.signature_officielle.outputs.officiel }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        id: dotnet
        continue-on-error: true
        with:
          global-json-file: scolia-pro/global.json
      - name: .NET de secours
        if: steps.dotnet.outcome == 'failure'
        run: bash scripts/installer-dotnet.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer le workload et SDK Android avec reprises limitees
        run: |
          bash scripts/install-android-sdk-retry.sh --self-test
          bash scripts/install-android-sdk-retry.sh

      # Les dépendances sont préparées avant le chargement de la clé historique.
      - uses: subosito/flutter-action@v2
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release/direct-apk-scolia-pro-20261103') }}
        with:
          channel: stable
          flutter-version: '3.44.0'
      - name: Préparer le candidat Flutter officiel sans secret
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release/direct-apk-scolia-pro-20261103') }}
        working-directory: scolia-pro/src/Scolia.Flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build aar --no-debug --no-profile --target-platform=android-arm,android-arm64
          python3 android_bridge/build_bridge.py
      # Seule la branche de publication doit voir les secrets de signature officiels.
      # Une PR compile avec une cle EPHEMERE : le cache Actions ne doit jamais
      # faire varier le certificat publie ni exposer la cle de l'etablissement.
      - name: Preparer la cle de validation (jamais publiable)
        if: github.event_name != 'push' || github.ref != 'refs/heads/release/direct-apk-scolia-pro-20261103'
        shell: bash
        run: bash scripts/cle-android.sh "$RUNNER_TEMP/scolia-validation-signature"
      # Une release officielle utilise exclusivement les secrets GitHub Actions.
      # Aucun cache de signature, aucune cle generee sur le runner en production.
      - name: Charger la cle officielle depuis les secrets GitHub Actions
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/direct-apk-scolia-pro-20261103'
        shell: bash
        env:
          SCOLIA_ANDROID_KEYSTORE: ${{ secrets.SCOLIA_ANDROID_KEYSTORE }}
          SCOLIA_ANDROID_KEYSTORE_PASS: ${{ secrets.SCOLIA_ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [[ -z "${SCOLIA_ANDROID_KEYSTORE:-}" || -z "${SCOLIA_ANDROID_KEYSTORE_PASS:-}" ]]; then
            # Sans secrets, la signature officielle est celle de la PR #18 (cle historique, meme certificat) :
            # cette compilation devient une simple validation, jamais publiee ni jointe a un paquet officiel.
            echo "::notice::Secrets de signature absents : signature officielle et publication assurees par la PR #18. Compilation de validation."
            echo "SCOLIA_SIGNATURE_DELEGUEE_PR18=true" >> "$GITHUB_ENV"
            bash scripts/cle-android.sh "$RUNNER_TEMP/scolia-validation-signature"
            exit 0
          fi
          bash scripts/cle-android.sh "$RUNNER_TEMP/scolia-official-signature"
      - name: Refuser un certificat different de la version Android deja installee
        shell: bash
        run: |
          set -euo pipefail
          attendu="E5:B5:F7:FA:41:54:11:EE:AC:4B:F7:34:84:90:24:FF:CF:7F:93:50:0C:60:13:83:99:31:B0:20:38:F5:89:80"
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/release/direct-apk-scolia-pro-20261103" && "${SCOLIA_SIGNATURE_DELEGUEE_PR18:-}" != "true" ]]; then
            if [[ "$SCOLIA_SIGNATURE_EMPREINTE" != "$attendu" ]]; then
              echo "::error::Empreinte officielle Android incorrecte. Ne pas changer la signature: les telephones ne pourraient plus mettre SCOLIA a jour." >&2
              exit 1
            fi
            echo "Certificat de distribution confirme."
          else
            echo "::notice::Compilation de validation : cette signature n'est pas destinee aux mises a jour officielles."
          fi
      - name: Activer Flutter uniquement avec la signature officielle confirmée
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/release/direct-apk-scolia-pro-20261103') && env.SCOLIA_SIGNATURE_DELEGUEE_PR18 != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s src/Scolia.Flutter/build/bridge/flutter-module.aar
          test -s src/Scolia.Flutter/build/bridge/scolia-flutter-bridge.jar
          echo "SCOLIA_FLUTTER_OFFICIAL=true" >> "$GITHUB_ENV"
      - name: Compiler APK natif
        run: |
          set -euo pipefail
          export JavaSdkDirectory="$JAVA_HOME"
          bash scripts/publier-android.sh
          shopt -s nullglob
          apks=(artifacts/android/SCOLIA_Pro_*_Android.apk)
          if [[ "${#apks[@]}" -ne 1 || ! -s "${apks[0]:-}" ]]; then
            echo "::error::APK signe introuvable ou ambigu." >&2
            exit 1
          fi
          # Inspecter le paquet reel, pas seulement la cle declaree avant compilation.
          mapfile -t signers < <(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V)
          if [[ "${#signers[@]}" -eq 0 ]]; then
            echo "::error::apksigner est introuvable dans le SDK Android." >&2
            exit 1
          fi
          certificate_details="$("${signers[-1]}" verify --print-certs "${apks[0]}")"
          # apksigner v36: "Signer #1 certificate SHA-256 digest: ..."
          # apksigner v37: "V2 Signer: ..." ou "V3.0 Signer: ..."
          # Refuser plusieurs certificats differents, et ne jamais utiliser le hash de la cle publique.
          mapfile -t apk_digests < <(printf '%s\n' "$certificate_details" |
            awk -F 'certificate SHA-256 digest:[[:space:]]*' '/Signer/ && NF == 2 {
              v = $2
              gsub(/[[:space:]:]/, "", v)
              print toupper(v)
            }' | sort -u)
          expected="$(printf '%s' "$SCOLIA_SIGNATURE_EMPREINTE" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]:')"
          echo "::notice::Certificats detectes dans l'APK : ${apk_digests[*]:-aucun}"
          echo "::notice::Certificat attendu depuis la cle : $expected"
          if [[ "${#apk_digests[@]}" -ne 1 || "${apk_digests[0]:-}" != "$expected" ]]; then
            echo "::error::Signature de l'APK incoherente avec celle de la cle utilisee." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/release/direct-apk-scolia-pro-20261103" && "${SCOLIA_SIGNATURE_DELEGUEE_PR18:-}" != "true" ]]; then
            echo "Signature de l'APK officiel verifiee."
            printf 'Signature : cle officielle de distribution SCOLIA\nEmpreinte certificat SHA-256 : %s\nCompatible avec les mises a jour des versions signees avec le meme certificat.\n' "$SCOLIA_SIGNATURE_EMPREINTE" > artifacts/android/IMPORTANT-SIGNATURE.txt
          else
            echo "Signature de l'APK de validation verifiee."
            printf 'APK de validation uniquement : certificat ephemere, NON compatible avec les installations officielles.\nNe pas installer ce paquet pour mettre a jour un poste scolaire en production.\nEmpreinte certificat SHA-256 : %s\n' "$SCOLIA_SIGNATURE_EMPREINTE" > artifacts/android/IMPORTANT-SIGNATURE.txt
          fi
      - name: Statut de la signature officielle
        id: signature_officielle
        shell: bash
        run: |
          if [[ "${SCOLIA_SIGNATURE_DELEGUEE_PR18:-}" != "true" && (("$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/release/direct-apk-scolia-pro-20261103") || "${SCOLIA_RECOVERY_PR18:-}" == "true") ]]; then
            echo "officiel=true" >> "$GITHUB_OUTPUT"
          else
            echo "officiel=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Comparer l'APK signé à la dernière version officielle installable
        if: steps.signature_officielle.outputs.officiel == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          # Choisir uniquement une release stable du client, jamais la console ou un paquet de test.
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^scolia-pro-v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.tag_name | ltrimstr("scolia-pro-v") | split(".") | map(tonumber)) | last | .tag_name // empty')"
          test -n "$tag"
          old="${tag#scolia-pro-v}"
          if [[ "$old" == "$version" ]]; then
            echo "::notice::Cette version est déjà publiée : aucune nouvelle mise à jour n'est annoncée."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/previous-scolia-apk"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "SCOLIA_Pro_${old}_Android.apk" --dir "$RUNNER_TEMP/previous-scolia-apk"
          mapfile -t tools < <(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V)
          signer="${tools[-1]}"
          # Never distribute an APK that silently fell back to the native-only build.
          test "${SCOLIA_FLUTTER_OFFICIAL:-false}" = true
          options=(--require-flutter)
          python3 src/Scolia.Flutter/android_bridge/verify_release_upgrade.py \
            --previous "$RUNNER_TEMP/previous-scolia-apk/SCOLIA_Pro_${old}_Android.apk" \
            --candidate "artifacts/android/SCOLIA_Pro_${version}_Android.apk" \
            --aapt "$(dirname "$signer")/aapt" --apksigner "$signer" "${options[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Pro_Android
          path: scolia-pro/artifacts/android/
          retention-days: 30

  paquet-windows:
    name: Paquet Windows
    # Windows ne doit pas dépendre du SDK ni du certificat Android.
    # !cancelled() permet d'exécuter Windows après un échec Android, mais pas après une annulation.
    needs: [qualite, paquet-android]
    if: ${{ !cancelled() && needs.qualite.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        id: dotnet
        continue-on-error: true
        with:
          global-json-file: scolia-pro/global.json
      - name: .NET de secours
        if: steps.dotnet.outcome == 'failure'
        shell: bash
        run: |
          if dotnet --list-sdks | grep -q '^10\.'; then dotnet --list-sdks; exit 0; fi
          curl -fsSL https://dot.net/v1/dotnet-install.ps1 -o "$RUNNER_TEMP/dotnet-install.ps1"
          v="$(curl -fsSL https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json | jq -r '."latest-sdk"')"
          pwsh -File "$RUNNER_TEMP/dotnet-install.ps1" -Version "$v" -InstallDir "$USERPROFILE/.dotnet" -AzureFeed https://builds.dotnet.microsoft.com/dotnet
          echo "$USERPROFILE/.dotnet" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scolia-pro/web/package-lock.json

      - name: Application Android à joindre au paquet officiel seulement
        # Sur une PR, Android est signe avec une cle ephemere : ne jamais diffuser cet APK.
        if: ${{ needs.paquet-android.result == 'success' && needs.paquet-android.outputs.officiel == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/release/direct-apk-scolia-pro-20261103' }}
        uses: actions/download-artifact@v5
        with:
          name: SCOLIA_Pro_Android
          path: scolia-pro/artifacts/android

      - name: Sources complètes pour préparer SCOLIA Phone iPhone
        uses: actions/download-artifact@v5
        with:
          name: SCOLIA_Pro_Sources
          path: scolia-pro/artifacts/sources

      - name: Publication autonome (un seul exécutable)
        shell: pwsh
        run: ./scripts/publier-windows.ps1

      - name: Démarrage réel du serveur SCOLIA
        shell: pwsh
        run: |
          # SCOLIA.exe est la fenêtre du poste ; le serveur qu'elle lance est SCOLIA-Serveur.exe.
          foreach ($exe in 'SCOLIA.exe', 'SCOLIA-Serveur.exe') {
            if (-not (Test-Path "artifacts/SCOLIA/$exe")) { throw "$exe manque dans le paquet." }
          }
          $env:Scolia__Reseau__Port = '5280'
          $env:Scolia__OuvrirNavigateur = 'false'
          $env:Scolia__Stockage__DataDirectory = Join-Path $env:RUNNER_TEMP 'scolia-donnees'
          $process = Start-Process -FilePath artifacts/SCOLIA/SCOLIA-Serveur.exe -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
              Start-Sleep -Milliseconds 500
              try { $ok = (Invoke-WebRequest http://localhost:5280/api/sante -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200 } catch { }
            }
            if (-not $ok) { throw 'SCOLIA-Serveur.exe ne répond pas.' }
            Write-Host "SCOLIA-Serveur.exe démarré et opérationnel."
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Pro_Windows_x64
          path: |
            scolia-pro/artifacts/*.zip
            scolia-pro/artifacts/*.sha256
            scolia-pro/artifacts/android/*.apk
          retention-days: 30
