name: JP-Services Admin - Android APK et Windows EXE independants

on:
  push:
    branches:
      - feature/jp-services-admin-app-20261109
    paths:
      - 'scolia-pro/owner-app/**'
      - '.github/workflows/scolia-owner-native.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publier une release officielle Admin signee, distincte de SCOLIA Client'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: scolia-owner-native-${{ github.ref }}
  cancel-in-progress: false

env:
  OWNER_VERSION: '1.0.0'
  RELEASE_TAG: 'scolia-owner-v1.0.0'

jobs:
  windows:
    name: SCOLIA Admin Windows - EXE et installateur
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compiler l'application Windows autonome
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish 'scolia-pro/owner-app/windows/SCOLIA.Owner.Admin.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o "$env:RUNNER_TEMP/owner-publish"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:RUNNER_TEMP/owner-publish/SCOLIA-JPServices-Admin.exe")) { throw "EXE principal manquant" }
      - name: Preparer Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup introuvable" }
      - name: Compiler l'installateur classique
        shell: pwsh
        working-directory: scolia-pro/owner-app/windows
        run: |
          $ErrorActionPreference = 'Stop'
          $env:OWNER_PUBLISH_DIR = "$env:RUNNER_TEMP/owner-publish"
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'Installer.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-ChildItem 'installer-output/*.exe' | Select-Object -First 1
          if (-not $setup -or $setup.Length -lt 100000) { throw "Installateur EXE invalide" }
          Get-FileHash -Algorithm SHA256 $setup.FullName | ForEach-Object { Write-Host "Installateur SHA-256: $($_.Hash)" }
      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA-JPServices-Admin-Windows-EXE
          path: scolia-pro/owner-app/windows/installer-output/*.exe
          if-no-files-found: error
          retention-days: 21

  android:
    name: SCOLIA Admin Android - APK separe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      official: ${{ steps.signer.outputs.official }}
    env:
      OWNER_ADMIN_KEYSTORE_B64: ${{ secrets.OWNER_ADMIN_KEYSTORE_B64 }}
      OWNER_ADMIN_KEYSTORE_PASSWORD: ${{ secrets.OWNER_ADMIN_KEYSTORE_PASSWORD }}
      OWNER_ADMIN_KEY_ALIAS: ${{ secrets.OWNER_ADMIN_KEY_ALIAS }}
      OWNER_ADMIN_KEY_PASSWORD: ${{ secrets.OWNER_ADMIN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Ubuntu GitHub runner already includes Android SDK and sdkmanager.
      # Avoid setup-android's obsolete 'tools' package installation.
      - name: Installer SDK Android
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Tester et assembler APK de previsualisation
        shell: bash
        run: |
          set -euo pipefail
          gradle -p scolia-pro/owner-app/android --no-daemon :app:assembleDebug
          test -s scolia-pro/owner-app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA-JPServices-Admin-Android-PREVIEW
          path: scolia-pro/owner-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 21
          if-no-files-found: error
      - name: Verifier la signature permanente Admin
        id: signer
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${OWNER_ADMIN_KEYSTORE_B64:-}" && -n "${OWNER_ADMIN_KEYSTORE_PASSWORD:-}" && -n "${OWNER_ADMIN_KEY_ALIAS:-}" && -n "${OWNER_ADMIN_KEY_PASSWORD:-}" ]]; then
            printf 'official=true\n' >> "$GITHUB_OUTPUT"
            echo 'La cle Admin permanente est disponible.'
          else
            printf 'official=false\n' >> "$GITHUB_OUTPUT"
            echo '::notice::Pas de cle Admin permanente : seul un APK PREVIEW (package .preview) est construit. Ne jamais le publier comme version officielle.'
          fi
      - name: Charger la cle de signature Admin sans l'afficher
        if: steps.signer.outputs.official == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OWNER_ADMIN_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/owner-admin-signing.jks"
          chmod 600 "$RUNNER_TEMP/owner-admin-signing.jks"
          echo "OWNER_ADMIN_KEYSTORE_FILE=$RUNNER_TEMP/owner-admin-signing.jks" >> "$GITHUB_ENV"
      - name: Construire APK officiel Admin
        if: steps.signer.outputs.official == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle -p scolia-pro/owner-app/android --no-daemon :app:assembleRelease
          test -s scolia-pro/owner-app/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose scolia-pro/owner-app/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: steps.signer.outputs.official == 'true'
        with:
          name: SCOLIA-JPServices-Admin-Android-SIGNE
          path: scolia-pro/owner-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publier les deux plateformes sur le canal Admin
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && needs.android.outputs.official == 'true'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SCOLIA-JPServices-Admin-Windows-EXE
          path: distribution/windows
      - uses: actions/download-artifact@v4
        with:
          name: SCOLIA-JPServices-Admin-Android-SIGNE
          path: distribution/android
      - name: Publier la release exclusivement Admin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s distribution/android/app-release.apk
          shopt -s nullglob
          setups=(distribution/windows/SCOLIA_JPServices_Admin_Setup_*_Windows_x64.exe)
          test "${#setups[@]}" -eq 1
          test -s "${setups[0]}"
          mv distribution/android/app-release.apk "distribution/android/SCOLIA_JPServices_Admin_${OWNER_VERSION}_Android.apk"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::La version Admin $RELEASE_TAG existe deja. Augmenter les numeros de version."
            exit 1
          fi
          gh release create "$RELEASE_TAG" "distribution/android/SCOLIA_JPServices_Admin_${OWNER_VERSION}_Android.apk" "${setups[0]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SCOLIA Pro - Console JP-Services Admin ${OWNER_VERSION}" \
            --notes "Canal autonome JP-Services. Android package com.jpservices.scolia.owner distinct de SCOLIA Phone. Windows installateur indépendant. Authentification Cloudflare Access et jeton propriétaire obligatoire. La mise à jour exige le maintien du certificat Android Admin. Programme Windows non signé Authenticode : contrôle SmartScreen possible."
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
