name: SCOLIA Natif - recherche, navigation et securite (Windows Android iOS)

on:
  push:
    paths:
      - 'scolia-pro/scripts/publier-android.sh'
      - 'scolia-pro/scripts/cle-android.sh'
      - 'scolia-pro/scripts/recuperer-cle-android-pr18-1226.sh'
      - 'scolia-pro/scripts/install-android-sdk-retry.sh'
      - 'scolia-pro/scripts/windows/**'
      - 'scolia-pro/src/Scolia.Bureau/**'
      - 'scolia-pro/src/Scolia.Mobile/**'
      - 'scolia-pro/src/Scolia.Phone.iOS/**'
      - 'scolia-pro/src/Scolia.Api/**'
      - 'scolia-pro/src/Scolia.Application/**'
      - 'scolia-pro/src/Scolia.Domain/**'
      - 'scolia-pro/src/Scolia.Infrastructure/**'
      - 'scolia-pro/tests/Scolia.Bureau.Tests/**'
      - 'scolia-pro/tests/Scolia.Mobile.Tests/**'
      - 'scolia-pro/tests/Scolia.Tests/**'
      - '.github/workflows/scolia-natif.yml'
  pull_request:
    paths:
      - 'scolia-pro/scripts/publier-android.sh'
      - 'scolia-pro/scripts/cle-android.sh'
      - 'scolia-pro/scripts/recuperer-cle-android-pr18-1226.sh'
      - 'scolia-pro/scripts/install-android-sdk-retry.sh'
      - 'scolia-pro/scripts/windows/**'
      - 'scolia-pro/src/Scolia.Bureau/**'
      - 'scolia-pro/src/Scolia.Mobile/**'
      - 'scolia-pro/src/Scolia.Phone.iOS/**'
      - 'scolia-pro/src/Scolia.Api/**'
      - 'scolia-pro/src/Scolia.Application/**'
      - 'scolia-pro/src/Scolia.Domain/**'
      - 'scolia-pro/src/Scolia.Infrastructure/**'
      - 'scolia-pro/tests/Scolia.Bureau.Tests/**'
      - 'scolia-pro/tests/Scolia.Mobile.Tests/**'
      - 'scolia-pro/tests/Scolia.Tests/**'
      - '.github/workflows/scolia-natif.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scolia-native-ux-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cache de signature accessible uniquement via la PR interne #18.
  # Cette exception est limitee a la distribution 1.2.31.
  SCOLIA_RECOVERY_PR18: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 18 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/direct-apk-scolia-pro-20261103' && github.event.pull_request.base.ref == 'feature/scolia-recovery-login-lock-20261103' }}
  SCOLIA_CHECKOUT_REF: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 18 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/direct-apk-scolia-pro-20261103' && github.event.pull_request.base.ref == 'feature/scolia-recovery-login-lock-20261103') && github.event.pull_request.head.sha || github.sha }}

defaults:
  run:
    working-directory: scolia-pro

jobs:
  qualite-native:
    name: Tests de navigation et composants Avalonia natifs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ env.SCOLIA_RECOVERY_PR18 == 'true' && env.SCOLIA_CHECKOUT_REF || '' }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: scolia-pro/global.json
      - name: Controler la source de recuperation PR18 sans secret
        shell: bash
        run: |
          bash -n scripts/recuperer-cle-android-pr18-1226.sh
          if bash scripts/recuperer-cle-android-pr18-1226.sh "$RUNNER_TEMP/aucune-cle" >/dev/null 2>&1; then
            echo "::error::Le script de signature a accepte un contexte sans autorisation." >&2
            exit 1
          fi
      - name: Bloquer les donnees de l'etablissement et les cles privees dans Git
        shell: bash
        run: |
          bash scripts/audit-tracked-files.sh --self-test
          bash scripts/audit-tracked-files.sh
      - name: Compiler le client Avalonia (vues partagees Windows Android iOS)
        run: dotnet build src/Scolia.Bureau/Scolia.Bureau.csproj -c Release
      - name: Tester les mises a jour Android (fin de telechargement, arriere-plan, erreurs)
        run: dotnet test tests/Scolia.Mobile.Tests/Scolia.Mobile.Tests.csproj -c Release --filter "FullyQualifiedName~UpdateCompletionPolicyTests|FullyQualifiedName~AndroidPrivacyManifestTests" --logger "trx;LogFileName=android-updates.trx"
      - name: Verifier les resultats du menu, les recherches contextuelles et la securite
        run: dotnet test tests/Scolia.Bureau.Tests/Scolia.Bureau.Tests.csproj -c Release --logger "trx;LogFileName=natif.trx"
      - name: Compiler les services de l'annee scolaire et des paiements
        run: dotnet build src/Scolia.Api/Scolia.Api.csproj -c Release
      - name: Verifier les regles de retard, les comptes et les API avec une base de test
        run: dotnet test tests/Scolia.Tests/Scolia.Tests.csproj -c Release --logger "trx;LogFileName=metier.trx"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: SCOLIA_Natif_Diagnostics
          path: scolia-pro/tests/Scolia.Bureau.Tests/TestResults/
          if-no-files-found: ignore

  android-natif:
    name: Produire un APK Android natif apres les tests
    needs: qualite-native
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ env.SCOLIA_RECOVERY_PR18 == 'true' && env.SCOLIA_CHECKOUT_REF || '' }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: scolia-pro/global.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Installer le workload et SDK Android avec reprises limitees
        run: |
          bash scripts/install-android-sdk-retry.sh --self-test
          bash scripts/install-android-sdk-retry.sh
      # Seule la branche de publication doit voir les secrets de signature officiels.
      # Une PR compile avec une cle EPHEMERE : le cache Actions ne doit jamais
      # faire varier le certificat publie ni exposer la cle de l'etablissement.
      - name: Preparer la cle de validation (jamais publiable)
        if: (github.event_name != 'push' || github.ref != 'refs/heads/release/direct-apk-scolia-pro-20261103') && env.SCOLIA_RECOVERY_PR18 != 'true'
        shell: bash
        run: bash scripts/cle-android.sh "$RUNNER_TEMP/scolia-validation-signature"
      # Une release officielle utilise exclusivement les secrets GitHub Actions.
      # Aucun cache de signature, aucune cle generee sur le runner en production.
      - name: Charger la cle officielle depuis les secrets GitHub Actions
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/direct-apk-scolia-pro-20261103'
        shell: bash
        env:
          SCOLIA_ANDROID_KEYSTORE: ${{ secrets.SCOLIA_ANDROID_KEYSTORE }}
          SCOLIA_ANDROID_KEYSTORE_PASS: ${{ secrets.SCOLIA_ANDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [[ -z "${SCOLIA_ANDROID_KEYSTORE:-}" || -z "${SCOLIA_ANDROID_KEYSTORE_PASS:-}" ]]; then
            echo "::error::Les secrets SCOLIA_ANDROID_KEYSTORE et SCOLIA_ANDROID_KEYSTORE_PASS sont obligatoires en production. Publication bloquee." >&2
            exit 1
          fi
          bash scripts/cle-android.sh "$RUNNER_TEMP/scolia-official-signature"
      # La PR #18 est la seule ref permettant d'acceder au cache original.
      # Le script verifie le certificat AVANT toute compilation distribuable.
      - name: Restaurer le cache historique de la PR 18 uniquement
        if: env.SCOLIA_RECOVERY_PR18 == 'true'
        id: cache_pr18_1226
        uses: actions/cache/restore@v4
        with:
          path: ~/.scolia-signature
          key: scolia-android-signature-v1
      - name: Authentifier la cle officielle de la PR 18 pour la 1.2.31
        if: env.SCOLIA_RECOVERY_PR18 == 'true'
        shell: bash
        env:
          SCOLIA_CACHE_HIT: ${{ steps.cache_pr18_1226.outputs.cache-hit }}
        run: bash scripts/recuperer-cle-android-pr18-1226.sh "$HOME/.scolia-signature"
      - name: Refuser un certificat different de la version Android deja installee
        shell: bash
        run: |
          set -euo pipefail
          attendu="E5:B5:F7:FA:41:54:11:EE:AC:4B:F7:34:84:90:24:FF:CF:7F:93:50:0C:60:13:83:99:31:B0:20:38:F5:89:80"
          if [[ ("$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/release/direct-apk-scolia-pro-20261103") || ("$SCOLIA_RECOVERY_PR18" == "true" && "$GITHUB_REF" == "refs/pull/18/merge") ]]; then
            if [[ "$SCOLIA_SIGNATURE_EMPREINTE" != "$attendu" ]]; then
              echo "::error::Empreinte officielle Android incorrecte. Ne pas changer la signature: les telephones ne pourraient plus mettre SCOLIA a jour." >&2
              exit 1
            fi
            echo "Certificat de distribution confirme."
          else
            echo "::notice::Compilation de validation : cette signature n'est pas destinee aux mises a jour officielles."
          fi
      - name: Compiler APK natif
        run: |
          set -euo pipefail
          export JavaSdkDirectory="$JAVA_HOME"
          bash scripts/publier-android.sh
          shopt -s nullglob
          apks=(artifacts/android/SCOLIA_Pro_*_Android.apk)
          if [[ "${#apks[@]}" -ne 1 || ! -s "${apks[0]:-}" ]]; then
            echo "::error::APK signe introuvable ou ambigu." >&2
            exit 1
          fi
          # Inspecter le paquet reel, pas seulement la cle declaree avant compilation.
          mapfile -t signers < <(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V)
          if [[ "${#signers[@]}" -eq 0 ]]; then
            echo "::error::apksigner est introuvable dans le SDK Android." >&2
            exit 1
          fi
          certificate_details="$("${signers[-1]}" verify --print-certs "${apks[0]}")"
          # apksigner v36: "Signer #1 certificate SHA-256 digest: ..."
          # apksigner v37: "V2 Signer: ..." ou "V3.0 Signer: ..."
          # Refuser plusieurs certificats differents, et ne jamais utiliser le hash de la cle publique.
          mapfile -t apk_digests < <(printf '%s\n' "$certificate_details" |
            awk -F 'certificate SHA-256 digest:[[:space:]]*' '/Signer/ && NF == 2 {
              v = $2
              gsub(/[[:space:]:]/, "", v)
              print toupper(v)
            }' | sort -u)
          expected="$(printf '%s' "$SCOLIA_SIGNATURE_EMPREINTE" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]:')"
          echo "::notice::Certificats detectes dans l'APK : ${apk_digests[*]:-aucun}"
          echo "::notice::Certificat attendu depuis la cle : $expected"
          if [[ "${#apk_digests[@]}" -ne 1 || "${apk_digests[0]:-}" != "$expected" ]]; then
            echo "::error::Signature de l'APK incoherente avec celle de la cle utilisee." >&2
            exit 1
          fi
          if [[ ("$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/release/direct-apk-scolia-pro-20261103") || ("$SCOLIA_RECOVERY_PR18" == "true" && "$GITHUB_REF" == "refs/pull/18/merge") ]]; then
            echo "Signature de l'APK officiel verifiee."
            printf 'Signature : cle officielle de distribution SCOLIA\nEmpreinte certificat SHA-256 : %s\nCompatible avec les mises a jour des versions signees avec le meme certificat.\n' "$SCOLIA_SIGNATURE_EMPREINTE" > artifacts/android/IMPORTANT-SIGNATURE.txt
          else
            echo "Signature de l'APK de validation verifiee."
            printf 'APK de validation uniquement : certificat ephemere, NON compatible avec les installations officielles.\nNe pas installer ce paquet pour mettre a jour un poste scolaire en production.\nEmpreinte certificat SHA-256 : %s\n' "$SCOLIA_SIGNATURE_EMPREINTE" > artifacts/android/IMPORTANT-SIGNATURE.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Natif_Android_APK
          path: scolia-pro/artifacts/android/
          retention-days: 30
          if-no-files-found: error

  windows-natif:
    name: Produire un EXE Windows natif apres les tests
    needs: qualite-native
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ env.SCOLIA_RECOVERY_PR18 == 'true' && env.SCOLIA_CHECKOUT_REF || '' }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: scolia-pro/global.json
      - name: Vérifier la syntaxe du script de signature Windows
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/windows/signer-windows.ps1).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "Script Authenticode invalide : $($errors[0].Message)" }
      - name: Publier l'application de bureau et le serveur local sans React
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/SCOLIA | Out-Null
          dotnet publish src/Scolia.Api -c Release -f net10.0-windows -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false `
            -o artifacts/SCOLIA
          if ($LASTEXITCODE -ne 0) { throw 'Erreur compilation du serveur Windows' }
          dotnet publish src/Scolia.Bureau -c Release -f net10.0 -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false -o artifacts/SCOLIA
          if ($LASTEXITCODE -ne 0) { throw 'Erreur compilation du client Avalonia Windows' }
          foreach ($exe in @('SCOLIA.exe','SCOLIA-Serveur.exe')) {
            if (-not (Test-Path "artifacts/SCOLIA/$exe")) { throw "Executable manquant : $exe" }
          }
          Copy-Item scripts/windows/LIRE_MOI.txt artifacts/SCOLIA/
          'Client Windows natif Avalonia. Aucune compilation du client web effectuee.' |
            Set-Content artifacts/SCOLIA/CONSTRUCTION-NATIVE.txt -Encoding utf8
          Compress-Archive -Path artifacts/SCOLIA -DestinationPath artifacts/SCOLIA_Natif_Windows_x64.zip -CompressionLevel Optimal
          (Get-FileHash artifacts/SCOLIA_Natif_Windows_x64.zip -Algorithm SHA256).Hash.ToLower() +
            '  SCOLIA_Natif_Windows_x64.zip' | Out-File artifacts/SCOLIA_Natif_Windows_x64.zip.sha256 -Encoding ascii
      - name: Signer les exécutables Windows officiels
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/direct-apk-scolia-pro-20261103'
        shell: pwsh
        env:
          SCOLIA_WINDOWS_SIGNING_PFX: ${{ secrets.SCOLIA_WINDOWS_SIGNING_PFX }}
          SCOLIA_WINDOWS_SIGNING_PASSWORD: ${{ secrets.SCOLIA_WINDOWS_SIGNING_PASSWORD }}
          SCOLIA_WINDOWS_CERT_THUMBPRINT: ${{ vars.SCOLIA_WINDOWS_CERT_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/windows/signer-windows.ps1 -Files @('artifacts/SCOLIA/SCOLIA.exe','artifacts/SCOLIA/SCOLIA-Serveur.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Échec de la signature Windows' }
          Remove-Item artifacts/SCOLIA_Natif_Windows_x64.zip -Force
          Compress-Archive -Path artifacts/SCOLIA -DestinationPath artifacts/SCOLIA_Natif_Windows_x64.zip -CompressionLevel Optimal
          (Get-FileHash artifacts/SCOLIA_Natif_Windows_x64.zip -Algorithm SHA256).Hash.ToLower() +
            '  SCOLIA_Natif_Windows_x64.zip' |
            Out-File artifacts/SCOLIA_Natif_Windows_x64.zip.sha256 -Encoding ascii
      - name: Compiler l'assistant d'installation EXE Windows (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Inno Setup est requis sur le runner Windows uniquement. Il n'est pas
          # necessaire sur les ordinateurs qui installent SCOLIA Pro.
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Installation de Inno Setup impossible' }
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue)?.Source
            if (-not $iscc) {
              $iscc = @(
                "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
                "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
              ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
          }
          if (-not $iscc) { throw 'Compilateur Inno Setup ISCC.exe introuvable' }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          & $iscc "/DAppVersion=$version" scripts/windows/SCOLIA-Pro.iss
          if ($LASTEXITCODE -ne 0) { throw 'Erreur de compilation du programme d installation SCOLIA' }
          $setup = "artifacts/installer/SCOLIA_Pro_Installation_${version}_Windows_x64.exe"
          if (-not (Test-Path $setup)) { throw "Installateur EXE introuvable : $setup" }
          if ((Get-Item $setup).Length -lt 1048576) { throw 'Installateur incomplet' }
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() +
            "  SCOLIA_Pro_Installation_${version}_Windows_x64.exe" |
            Out-File "$setup.sha256" -Encoding ascii
          Write-Host "Installateur autonome : $setup"
      - name: Signer et vérifier l'installateur Windows officiel
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/direct-apk-scolia-pro-20261103'
        shell: pwsh
        env:
          SCOLIA_WINDOWS_SIGNING_PFX: ${{ secrets.SCOLIA_WINDOWS_SIGNING_PFX }}
          SCOLIA_WINDOWS_SIGNING_PASSWORD: ${{ secrets.SCOLIA_WINDOWS_SIGNING_PASSWORD }}
          SCOLIA_WINDOWS_CERT_THUMBPRINT: ${{ vars.SCOLIA_WINDOWS_CERT_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $setup = "artifacts/installer/SCOLIA_Pro_Installation_${version}_Windows_x64.exe"
          & ./scripts/windows/signer-windows.ps1 -Files @($setup)
          if ($LASTEXITCODE -ne 0) { throw 'Échec de la signature de l installateur Windows' }
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() +
            "  SCOLIA_Pro_Installation_${version}_Windows_x64.exe" |
            Out-File "$setup.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Pro_Windows_Installateur_EXE
          path: |
            scolia-pro/artifacts/installer/SCOLIA_Pro_Installation_*_Windows_x64.exe
            scolia-pro/artifacts/installer/SCOLIA_Pro_Installation_*_Windows_x64.exe.sha256
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: SCOLIA_Natif_Windows_x64
          path: |
            scolia-pro/artifacts/SCOLIA_Natif_Windows_x64.zip
            scolia-pro/artifacts/SCOLIA_Natif_Windows_x64.zip.sha256
          retention-days: 30
          if-no-files-found: error

  # Les paquets historiques 1.2.3 sont déjà publiés ; les nouvelles versions sont
  # distribuées uniquement après les compilations actuelles Android et Windows.

  android-publication-officielle:
    name: Publier automatiquement les versions Android et Windows sur GitHub Releases
    # Push officiel avec secrets, OU exception ponctuelle depuis la PR #18
    # portant la vraie cle historique (version 1.2.31 exclusivement).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/release/direct-apk-scolia-pro-20261103') ||
      (github.event_name == 'pull_request' && github.event.pull_request.number == 18 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'release/direct-apk-scolia-pro-20261103' &&
       github.event.pull_request.base.ref == 'feature/scolia-recovery-login-lock-20261103')
    needs: [android-natif, windows-natif]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ env.SCOLIA_RECOVERY_PR18 == 'true' && env.SCOLIA_CHECKOUT_REF || '' }}
      - uses: actions/download-artifact@v4
        with:
          name: SCOLIA_Natif_Android_APK
          path: scolia-pro/artifacts/ota-apk
      - uses: actions/download-artifact@v4
        with:
          name: SCOLIA_Pro_Windows_Installateur_EXE
          path: scolia-pro/artifacts/ota-setup
      - name: Afficher l'evenement et l'origine de la publication
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Événement : $EVENT_NAME"
          echo "Référence : $REF_NAME"
          echo "Branche PR : $HEAD_REF"
      - name: Verifier les empreintes et publier les programmes officiels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Version invalide'; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            if [[ "$SCOLIA_RECOVERY_PR18" != 'true' || "$GITHUB_REF" != 'refs/pull/18/merge' || "$version" != '1.2.31' ]]; then
              echo '::error::PR de publication non autorisee, ou version differente de 1.2.31.' >&2
              exit 1
            fi
            # Les jobs de compilation ont utilise exclusivement la tete de la
            # branche officielle. Un nouveau commit pendant le build annule la
            # publication pour eviter toute fuite d'artefacts perimes.
            current="$(git ls-remote "https://github.com/${GH_REPO}.git" refs/heads/release/direct-apk-scolia-pro-20261103 | cut -f1)"
            if [[ -z "$current" || "$current" != "$SCOLIA_CHECKOUT_REF" || "$(git rev-parse HEAD)" != "$current" ]]; then
              echo "::error::La tete de la branche release a change pendant le build." >&2
              exit 1
            fi
            echo '::notice::Release 1.2.31 depuis PR18, cle Android historique validee ; Windows sans Authenticode (procedure 1.2.17).'
          elif [[ "$GITHUB_EVENT_NAME" != 'push' || "$GITHUB_REF" != 'refs/heads/release/direct-apk-scolia-pro-20261103' ]]; then
            echo '::error::Contexte de publication non autorise.' >&2
            exit 1
          fi
          apk="artifacts/ota-apk/SCOLIA_Pro_${version}_Android.apk"
          sha="$apk.sha256"
          test -s "$apk" && test -s "$sha"
          (cd artifacts/ota-apk && sha256sum -c "SCOLIA_Pro_${version}_Android.apk.sha256")
          setup="artifacts/ota-setup/SCOLIA_Pro_Installation_${version}_Windows_x64.exe"
          setup_sha="$setup.sha256"
          test -s "$setup" && test -s "$setup_sha"
          (cd artifacts/ota-setup && sha256sum -c "SCOLIA_Pro_Installation_${version}_Windows_x64.exe.sha256")
          tag="scolia-pro-v${version}"
          # Une version publiée est IMMUTABLE : ne jamais remplacer un APK/EXE sous le meme tag.
          # Incrementez Version et AndroidVersionCode dans les sources avant une nouvelle release.
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::notice::La version $tag est deja publiee : aucun remplacement d'APK ou d'EXE."
            exit 0
          fi
          gh release create "$tag" "$apk" "$sha" "$setup" "$setup_sha" \
            --repo "$GH_REPO" --target "$SCOLIA_CHECKOUT_REF" --latest \
            --title "SCOLIA Pro ${version} - Android et Windows" \
            --notes "SCOLIA Pro ${version} : navigation Windows clarifiée. Compte conserve Informations et Aide, Réseau et postes devient une rubrique dédiée (appareils, jumelage, Tailscale, synchronisation, conflits). Dans Paramètres : apparence et confort, sécurité du compte, À propos avec version, éditeur, développeur et recherche manuelle des mises à jour ; contrôle depuis Compte > Informations conservé. Encaissement par lot : Premier mois en retard, Mois prochain (2e retard), Tous les mois en retard, Tous les mois ouverts ; chronologie exacte et recalcul des dossiers sélectionnés même après filtrage. Les accès sécurisés et autorisations existantes sont maintenus. Android : parcours de compte et de configuration inchangé. Signature Android historique contrôlée, empreintes SHA-256, Windows EXE avec assistant. Les écritures hors ligne restent provisoires jusqu’à validation serveur. Sauvegarder les données avant mise à jour."
          gh release view "$tag" --repo "$GH_REPO" --json url,assets \
            --jq '{url, fichiers: [.assets[] | select(.name | endswith(".apk") or endswith(".exe")) | {name,url,digest}]}'
