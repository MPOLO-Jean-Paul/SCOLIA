name: Inspecter archives SCOLIA
on:
  push:
    branches:
      - feature/scolia-biometric-mobile
    paths:
      - '.github/workflows/inspect-scolia-archive.yml'
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scolia-biometric-mobile
      - name: Inventorier l'archive sans modifier les sources
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          file=pathlib.Path('SCOLIA OK.zip')
          with zipfile.ZipFile(file) as z:
              names=z.namelist()
              report=['Archive vérifiée: '+file.name, 'Entrées: '+str(len(names)),
                      'Chemins liés aux sources et à la connexion:']
              report += [n for n in names if any(x in n.lower() for x in ('mobile','android','login','auth','secret','security','csproj','sln','gradle','package.json'))][:240]
              report += ['Premières entrées:'] + names[:90]
          pathlib.Path('ARCHIVE_INVENTORY.txt').write_text('\n'.join(report)+'\n')
          PY
      - name: Sauvegarder uniquement l'inventaire sur la branche de travail
        shell: bash
        run: |
          git config user.name "scolia-actions"
          git config user.email "actions@users.noreply.github.com"
          git add ARCHIVE_INVENTORY.txt
          git diff --cached --quiet || (git commit -m "docs: inventory existing SCOLIA archive" && git push)
