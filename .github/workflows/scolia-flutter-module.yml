name: SCOLIA Flutter - module Android
on:
  pull_request:
    paths:
      - 'scolia-pro/src/Scolia.Flutter/**'
      - '.github/workflows/scolia-flutter-module.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scolia-pro/src/Scolia.Flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build aar --no-debug --no-profile
      - uses: actions/upload-artifact@v4
        with:
          name: scolia-flutter-module-aar-validation
          path: scolia-pro/src/Scolia.Flutter/build/host/outputs/repo/
          if-no-files-found: error
