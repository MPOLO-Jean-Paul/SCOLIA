name: SCOLIA Pro 1.2.7 - Publication test Android Windows

on:
  push:
    branches:
      - release/direct-apk-scolia-pro-20261103
    paths:
      - '.github/workflows/publier-scolia-1-2-7-test.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publier-test:
    name: Publier les executables testes SCOLIA 1.2.7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Telecharger les binaires compiles avec tests reussis
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist/android dist/windows
          gh run download 41778272532 --repo "$GH_REPO" --name SCOLIA_Natif_Android_APK --dir dist/android
          gh run download 41778272532 --repo "$GH_REPO" --name SCOLIA_Pro_Windows_Installateur_EXE --dir dist/windows
          (
            cd dist/android
            test -s SCOLIA_Pro_1.2.7_Android.apk
            test -s SCOLIA_Pro_1.2.7_Android.apk.sha256
            sha256sum --check SCOLIA_Pro_1.2.7_Android.apk.sha256
          )
          (
            cd dist/windows
            test -s SCOLIA_Pro_Installation_1.2.7_Windows_x64.exe
            test -s SCOLIA_Pro_Installation_1.2.7_Windows_x64.exe.sha256
            sha256sum --check SCOLIA_Pro_Installation_1.2.7_Windows_x64.exe.sha256
          )
      - name: Creer la version test telechargeable directement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="scolia-pro-v1.2.7-test"
          apk=dist/android/SCOLIA_Pro_1.2.7_Android.apk
          setup=dist/windows/SCOLIA_Pro_Installation_1.2.7_Windows_x64.exe
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$apk.sha256" "$setup" "$setup.sha256" --repo "$GH_REPO" --clobber
            gh release edit "$tag" --repo "$GH_REPO" --prerelease
          else
            gh release create "$tag" "$apk" "$apk.sha256" "$setup" "$setup.sha256" \
              --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease \
              --title "SCOLIA Pro 1.2.7 - TEST serveur arriere-plan Android" \
              --notes "Version de test du maintien de l'API lorsque SCOLIA est reduit. Nouveau service Android connectedDevice, sondes sante locale et IPv4, notification diagnostique. Testez depuis un PC via http://ADRESSE_DU_TELEPHONE:5080/api/sante avant et apres Home. Fichiers verifies par SHA-256 et signatures. Ne pas desinstaller SCOLIA existant. Sauvegarder la base avant test. Aucune garantie de disponibilite 24 h sans tests sur appareil et reseau reels."
          fi
          gh release view "$tag" --repo "$GH_REPO" --json url,assets
