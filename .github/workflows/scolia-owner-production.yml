# Console proprietaire: execution manuelle depuis main, source epinglee.
name: SCOLIA Pro - Console JP-Services (production protegee)
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "J'ai verifie Cloudflare Access, MFA, les secrets et le domaine"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: scolia-owner-production
  cancel-in-progress: false
jobs:
  verify:
    name: Tests sans secrets
    if: github.ref == 'refs/heads/main' && github.actor == 'MPOLO-Jean-Paul'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scolia-pro/deploy/owner-console
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d25c6971e325498af5a17e8c0ce6e3e4d12f01fc
          persist-credentials: false
      - name: Verifier la revision
        run: test "$(git rev-parse HEAD)" = 'd25c6971e325498af5a17e8c0ce6e3e4d12f01fc'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dependances et tester
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Eviter les fichiers sensibles dans le projet
        run: |
          if find . -path './node_modules' -prune -o -type f \( -name '*.pem' -o -name '*.key' -o -name '.env' -o -name '*.db' -o -name '*.sqlite' \) -print | grep -q .; then
            echo "::error::Fichier sensible dans les sources."
            exit 1
          fi
  deploy:
    name: Publier sur Cloudflare
    needs: verify
    if: github.ref == 'refs/heads/main' && github.actor == 'MPOLO-Jean-Paul' && inputs.confirm_production == true
    runs-on: ubuntu-latest
    environment: scolia-owner-production
    timeout-minutes: 25
    defaults:
      run:
        working-directory: scolia-pro/deploy/owner-console
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OWNER_ADMIN_TOKEN: ${{ secrets.SCOLIA_OWNER_ADMIN_TOKEN }}
      CF_OWNER_DOMAIN: ${{ vars.SCOLIA_OWNER_DOMAIN || 'scolia-pro-owner.jeanpaulmpolo242.workers.dev' }}
      OWNER_ACCESS_AUD: ${{ vars.SCOLIA_OWNER_ACCESS_AUD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d25c6971e325498af5a17e8c0ce6e3e4d12f01fc
          persist-credentials: false
      - name: Verifier la revision
        run: test "$(git rev-parse HEAD)" = 'd25c6971e325498af5a17e8c0ce6e3e4d12f01fc'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refuser tout deploiement incomplet
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID OWNER_ADMIN_TOKEN CF_OWNER_DOMAIN OWNER_ACCESS_AUD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Parametre manquant : $name."
              exit 1
            fi
          done
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo "::error::Identifiant Cloudflare invalide."
            exit 1
          fi
          if (( ${#OWNER_ADMIN_TOKEN} < 32 )); then
            echo "::error::Jeton administrateur trop court."
            exit 1
          fi
      - name: Installer et retester les sources
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Preparer la base D1 et les sauvegardes R2
        run: node scripts/prepare-production.mjs
      - name: Appliquer les migrations D1 non appliquees
        run: npx wrangler d1 migrations apply OWNER_DB --remote --config wrangler.production.json
      - name: Deployer le Worker
        run: npx wrangler deploy --config wrangler.production.json
      - name: Installer le secret de la console
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OWNER_ADMIN_TOKEN" | npx wrangler secret put OWNER_ADMIN_TOKEN --config wrangler.production.json
      - name: Verifier HTTPS et le refus des visiteurs anonymes
        shell: bash
        run: |
          set -euo pipefail
          base="https://$CF_OWNER_DOMAIN"
          curl --fail --silent --show-error --max-time 25 "$base/health" -o /tmp/scolia-owner-health.json
          node -e 'const fs=require("fs");const h=JSON.parse(fs.readFileSync("/tmp/scolia-owner-health.json"));if(h.service!=="SCOLIA Pro Owner")process.exit(1)'
          curl --fail --silent --show-error --max-time 25 "$base/api/v1/notice" -o /tmp/scolia-owner-notice.json
          status="$(curl --silent --show-error --max-time 25 -o /dev/null -w '%{http_code}' "$base/api/v1/owner/summary")"
          if [[ "$status" == "200" || "$status" == "000" ]]; then
            echo "::error::Route proprietaire ouverte ou verification impossible."
            exit 1
          fi
      - name: Resume du succes
        if: success()
        run: |
          echo "Console SCOLIA deployee sur https://$CF_OWNER_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Source epinglee : d25c6971e325498af5a17e8c0ce6e3e4d12f01fc" >> "$GITHUB_STEP_SUMMARY"
