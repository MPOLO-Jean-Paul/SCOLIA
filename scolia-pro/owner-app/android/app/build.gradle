plugins {
    id 'com.android.application'
}

def keyFile = System.getenv('OWNER_ADMIN_KEYSTORE_FILE')
def keyPass = System.getenv('OWNER_ADMIN_KEYSTORE_PASSWORD')
def alias = System.getenv('OWNER_ADMIN_KEY_ALIAS')
def aliasPass = System.getenv('OWNER_ADMIN_KEY_PASSWORD')
def signedRelease = keyFile && keyPass && alias && aliasPass

android {
    namespace 'com.jpservices.scolia.owner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jpservices.scolia.owner'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        admin {
            if (signedRelease) {
                storeFile file(keyFile)
                storePassword keyPass
                keyAlias alias
                keyPassword aliasPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signedRelease) signingConfig signingConfigs.admin
        }
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

tasks.register('verifyOwnerSigning') {
    doLast {
        if (!signedRelease) throw new GradleException('Signature Admin permanente absente : publication officielle refusee.')
    }
}
tasks.matching { it.name == 'assembleRelease' }.configureEach {
    dependsOn(tasks.named('verifyOwnerSigning'))
}
