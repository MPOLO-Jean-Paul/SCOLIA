<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SCOLIA Pro publicité</title>
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(assets/Inter-Regular.otf); }
@font-face { font-family: Inter; font-weight: 500; src: url(assets/Inter-Medium.otf); }
@font-face { font-family: Inter; font-weight: 600; src: url(assets/Inter-SemiBold.otf); }
@font-face { font-family: Inter; font-weight: 700; src: url(assets/Inter-Bold.otf); }
@font-face { font-family: Inter; font-weight: 800; src: url(assets/Inter-ExtraBold.otf); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #f5f5f7; }
body { font-family: Inter, sans-serif; color: #1d1d1f; -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 0; top: 0; overflow: hidden; background: #f5f5f7; }
.abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
.blob { position: absolute; border-radius: 50%; }
.cap { position: absolute; }
.cap .k { font-weight: 600; letter-spacing: .01em; }
.cap .t { font-weight: 800; letter-spacing: -.025em; line-height: 1.04; margin-top: .25em; }
.cap .s { font-weight: 400; color: #515154; line-height: 1.38; margin-top: .7em; }
.cap > div { will-change: transform, opacity; }

.win { border-radius: 14px; overflow: hidden; background: #fff;
  box-shadow: 0 40px 90px rgba(17,24,39,.20), 0 10px 28px rgba(17,24,39,.10), 0 0 0 1px rgba(0,0,0,.06); }
.win .bar { height: 36px; background: linear-gradient(#f6f6f6, #ececec); border-bottom: 1px solid #dcdcdc; position: relative; }
.win .bar i { position: absolute; top: 12px; width: 12px; height: 12px; border-radius: 50%; }
.win .bar b { position: absolute; left: 0; right: 0; top: 10px; text-align: center; font: 600 13px Inter; color: #6e6e73; }
.win .view { position: relative; overflow: hidden; }
.win .view img, .dev .view img { position: absolute; left: 0; top: 0; width: 100%; }

.dev { background: #1d1d1f;
  box-shadow: 0 40px 90px rgba(17,24,39,.25), 0 10px 26px rgba(17,24,39,.12), inset 0 0 0 2px #3a3a3c; }
.dev .screen { position: absolute; overflow: hidden; background: #fff; }
.dev .status { position: absolute; left: 0; right: 0; top: 0; background: #fff; display: flex; align-items: center; justify-content: space-between; font-weight: 600; color: #1d1d1f; }
.dev .view { position: absolute; left: 0; right: 0; bottom: 0; overflow: hidden; }
.dev .cam { position: absolute; border-radius: 50%; background: #0b0b0c; box-shadow: inset 0 0 0 2px #2a2a2c; }

.chip { display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.96); border-radius: 18px; padding: 14px 22px 14px 14px;
  box-shadow: 0 18px 44px rgba(17,24,39,.16), 0 3px 10px rgba(17,24,39,.08), 0 0 0 1px rgba(0,0,0,.04); white-space: nowrap; }
.chip .ic { width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex: none; }
.chip .l1 { font-weight: 700; font-size: 20px; }
.chip .l2 { font-weight: 400; font-size: 16px; color: #6e6e73; margin-top: 2px; }

.tile { background: #fff; border-radius: 26px; padding: 30px 28px;
  box-shadow: 0 18px 40px rgba(17,24,39,.08), 0 2px 6px rgba(17,24,39,.05), 0 0 0 1px rgba(0,0,0,.04); }
.tile .ic { width: 64px; height: 64px; border-radius: 17px; display: flex; align-items: center; justify-content: center; }
.tile .n { font-weight: 700; font-size: 27px; margin-top: 22px; letter-spacing: -.01em; }
.tile .d { font-size: 19px; color: #6e6e73; margin-top: 6px; line-height: 1.35; }

.cta { display: inline-flex; align-items: center; gap: 12px; background: #007aff; color: #fff; font-weight: 700; border-radius: 999px;
  box-shadow: 0 16px 36px rgba(0,122,255,.35); }
.center { text-align: center; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const F = new URLSearchParams(location.search).get('f') || 'h';
const V = F === 'v';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const DURATION = 48;
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';

// ---------- Outils de mouvement ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, x) => a + (b - a) * x;
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  (parent || stage).appendChild(e);
  return e;
}
const tracks = [];
// Un élément animé : fn(t) rend { o, x, y, s, r } ; x et y s'ajoutent à la position de base.
function track(e, x, y, fn) {
  e.style.left = x + 'px'; e.style.top = y + 'px';
  tracks.push({ e, fn });
  return e;
}
function apply(e, st) {
  const o = st.o === undefined ? 1 : st.o;
  e.style.opacity = o.toFixed(4);
  e.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
  e.style.transform = `translate(${(st.x || 0).toFixed(2)}px, ${(st.y || 0).toFixed(2)}px) scale(${(st.s || 1).toFixed(4)}) rotate(${(st.r || 0).toFixed(3)}deg)`;
}
// Entrée puis sortie d'un élément dans une scène [a, b].
function life(t, a, b, opt = {}) {
  const din = opt.din || .9, dout = opt.dout || .55, dy = opt.dy === undefined ? 70 : opt.dy, dx = opt.dx || 0;
  const i = easeOut((t - a) / din), q = easeIn((t - (b - dout)) / dout);
  const s0 = opt.s0 === undefined ? .955 : opt.s0;
  return {
    o: t < a || t > b ? 0 : Math.min(clamp((t - a) / (din * .7)), 1 - q),
    x: (1 - i) * dx - q * (opt.ox || 0),
    y: (1 - i) * dy - q * (opt.oy === undefined ? 34 : opt.oy) + (opt.float ? Math.sin((t - a) * 1.1) * opt.float : 0),
    s: lerp(s0, 1, i) * (1 + q * (opt.os || 0)),
  };
}

// ---------- Fond ----------
const blobs = [
  { c: 'rgba(0,122,255,.16)', r: V ? 900 : 1000, x: .15, y: .2, ax: .08, ay: .06, sp: .11 },
  { c: 'rgba(52,199,89,.13)', r: V ? 820 : 900, x: .88, y: .85, ax: .07, ay: .05, sp: .09 },
  { c: 'rgba(175,82,222,.10)', r: V ? 760 : 800, x: .8, y: .1, ax: .06, ay: .08, sp: .07 },
].map(b => {
  const e = el('div', 'blob');
  e.style.width = e.style.height = b.r + 'px';
  e.style.background = `radial-gradient(circle at center, ${b.c} 0%, rgba(255,255,255,0) 68%)`;
  return { ...b, e };
});
function background(t) {
  for (const b of blobs) {
    const x = (b.x + Math.sin(t * b.sp * 2 * Math.PI / 4) * b.ax) * W - b.r / 2;
    const y = (b.y + Math.cos(t * b.sp * 2 * Math.PI / 5) * b.ay) * H - b.r / 2;
    b.e.style.transform = `translate(${x}px, ${y}px)`;
  }
}

// ---------- Appareils ----------
const DESK_CROP = 840; // bas des captures retiré : barre d'état et bulles d'astuce
function windowFrame(width, images) {
  // En vertical, l'écran est agrandi sur la zone de travail : la barre latérale sort du cadre.
  const s = V ? .86 : width / 1440, vh = Math.round(DESK_CROP * s), off = V ? -262 * s : 0;
  const w = el('div', 'abs win');
  w.style.width = width + 'px';
  el('div', 'bar', w, '<i style="left:14px;background:#ff5f57"></i><i style="left:34px;background:#febc2e"></i><i style="left:54px;background:#28c840"></i><b>SCOLIA Pro</b>');
  const view = el('div', 'view', w); view.style.height = vh + 'px';
  const imgs = images.map(src => { const i = el('img', '', view); i.src = 'assets/' + src; i.style.width = (1440 * s) + 'px'; i.style.left = off + 'px'; return i; });
  return { e: w, imgs, view, h: vh + 36 };
}
function phoneFrame(scale, images) {
  const sw = 412 * scale, bar = 30 * scale, sh = 915 * scale + bar, bz = 13 * scale;
  const d = el('div', 'abs dev');
  d.style.width = (sw + 2 * bz) + 'px'; d.style.height = (sh + 2 * bz) + 'px'; d.style.borderRadius = (54 * scale) + 'px';
  const sc = el('div', 'screen', d);
  Object.assign(sc.style, { left: bz + 'px', top: bz + 'px', width: sw + 'px', height: sh + 'px', borderRadius: (42 * scale) + 'px' });
  const st = el('div', 'status', sc, `<span>08:15</span><span>${signal()}</span>`);
  Object.assign(st.style, { height: bar + 'px', fontSize: (13 * scale) + 'px', padding: `0 ${22 * scale}px`, paddingTop: (4 * scale) + 'px' });
  st.lastChild.style.display = 'flex'; st.lastChild.style.height = (12 * scale) + 'px';
  const cam = el('div', 'cam', sc); const cr = 11 * scale;
  Object.assign(cam.style, { width: cr + 'px', height: cr + 'px', left: (sw / 2 - cr / 2) + 'px', top: (9 * scale) + 'px' });
  const view = el('div', 'view', sc); view.style.top = bar + 'px';
  const imgs = images.map(src => { const i = el('img', '', view); i.src = 'assets/' + src; return i; });
  return { e: d, imgs, w: sw + 2 * bz, h: sh + 2 * bz };
}
function signal() {
  return `<svg viewBox="0 0 54 12" height="100%"><g fill="#1d1d1f"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/>
  <path d="M22 4.5a9 9 0 0 1 11 0l-1.6 1.8a6.5 6.5 0 0 0-7.8 0zM24.8 7.6a5 5 0 0 1 5.4 0l-2.7 3z"/>
  <rect x="38" y="1.5" width="14" height="9" rx="2.5" fill="none" stroke="#1d1d1f" stroke-width="1.3"/><rect x="40" y="3.4" width="9" height="5.2" rx="1.2"/></g></svg>`;
}
function tabletFrame(width, image) {
  const s = width / 1280, sh = 800 * s, bz = 20;
  const d = el('div', 'abs dev');
  d.style.width = (width + 2 * bz) + 'px'; d.style.height = (sh + 2 * bz) + 'px'; d.style.borderRadius = '34px';
  const sc = el('div', 'screen', d);
  Object.assign(sc.style, { left: bz + 'px', top: bz + 'px', width: width + 'px', height: sh + 'px', borderRadius: '16px' });
  const view = el('div', 'view', sc); view.style.top = '0';
  const i = el('img', '', view); i.src = 'assets/' + image;
  const cam = el('div', 'cam', d); Object.assign(cam.style, { width: '8px', height: '8px', left: (width / 2 + bz - 4) + 'px', top: '6px' });
  return { e: d, w: width + 2 * bz, h: sh + 2 * bz };
}
function crossfade(imgs, t, times) {
  // times : instants où l'image suivante apparaît
  imgs.forEach((img, k) => {
    if (k === 0) return;
    img.style.opacity = clamp((t - times[k - 1]) / .6).toFixed(3);
  });
}

// ---------- Icônes ----------
const I = {
  people: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3 3-4.6 5.5-4.6s4.7 1.6 5.5 4.6"/><circle cx="16.6" cy="9" r="2.5"/><path d="M15.8 14.2c2.3 0 4 1.4 4.8 4.3"/>',
  receipt: '<path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9 8h6M9 12h6M9 16h3.5"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.8"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15.2l2 2 4-4"/>',
  chat: '<path d="M4.5 5h15a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H10l-5 4v-4h-.5A1.5 1.5 0 0 1 3 14.5v-8A1.5 1.5 0 0 1 4.5 5z"/><path d="M8 10.5h.01M12 10.5h.01M16 10.5h.01"/>',
  cap: '<path d="M2.5 9.5 12 5l9.5 4.5L12 14z"/><path d="M6.5 11.6v4.4c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3v-4.4M21.5 9.5v5"/>',
  check: '<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V2.8h6V4M8.6 13.2l2.4 2.4 4.4-4.8"/>',
  badge: '<rect x="4" y="3" width="16" height="18" rx="2.8"/><circle cx="12" cy="10" r="2.8"/><path d="M7.5 17.2c.9-2 2.5-3 4.5-3s3.6 1 4.5 3"/>',
  cloud: '<path d="M7 18.5a4.5 4.5 0 0 1-.6-9 6 6 0 0 1 11.5 1.6 3.8 3.8 0 0 1-.4 7.4z"/><path d="M12 16.5v-5M9.8 13.7 12 11.5l2.2 2.2"/>',
  live: '<circle cx="12" cy="12" r="3"/><path d="M7.4 7.4a6.5 6.5 0 0 0 0 9.2M16.6 7.4a6.5 6.5 0 0 1 0 9.2M4.6 4.6a10.5 10.5 0 0 0 0 14.8M19.4 4.6a10.5 10.5 0 0 1 0 14.8"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5M12 14.5v2"/>',
  offline: '<path d="M3 3l18 18M8.5 8.6a6 6 0 0 0-2.1.9 4.5 4.5 0 0 0 .6 9h10.5M19.6 17.4a3.8 3.8 0 0 0-2.1-6.3 6 6 0 0 0-7-5"/>',
  sync: '<path d="M20 12a8 8 0 0 1-14.3 4.9M4 12a8 8 0 0 1 14.3-4.9"/><path d="M18.6 3.2v4h-4M5.4 20.8v-4h4"/>',
  qr: '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2.5v2.5H14zM17.5 17.5H20V20h-2.5zM14 19h1M19 14h1"/>',
  chart: '<path d="M4 20h16"/><rect x="5.5" y="11" width="3" height="6.5" rx="1"/><rect x="10.5" y="7" width="3" height="10.5" rx="1"/><rect x="15.5" y="4" width="3" height="13.5" rx="1"/>',
};
const icon = (name, size, color = '#fff', sw = 2) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${I[name]}</svg>`;
function chip(x, y, iconName, color, l1, l2, a, b, opt = {}) {
  const c = el('div', 'abs chip', stage,
    `<div class="ic" style="background:${color}">${icon(iconName, 26)}</div><div><div class="l1">${l1}</div>${l2 ? `<div class="l2">${l2}</div>` : ''}</div>`);
  const k = opt.scale || 1;
  c.style.transformOrigin = 'left top';
  track(c, x, y, t => { const st = life(t, a, b, { dy: 30, s0: .9, din: .7, float: 3, ...opt }); st.s *= k; return st; });
  return c;
}

// ---------- Légendes ----------
function caption(k, color, title, sub, a, b) {
  const c = el('div', 'cap');
  const fs = V ? { k: 30, t: 84, s: 34 } : { k: 26, t: 74, s: 30 };
  if (V) { Object.assign(c.style, { left: '80px', width: (W - 160) + 'px', top: '190px', textAlign: 'center' }); }
  else { Object.assign(c.style, { left: '130px', width: '590px', top: '0px', height: H + 'px', display: 'flex', flexDirection: 'column', justifyContent: 'center' }); }
  const parts = [
    el('div', 'k', c, k), el('div', 't', c, title), el('div', 's', c, sub),
  ];
  parts[0].style.fontSize = fs.k + 'px'; parts[0].style.color = color;
  parts[1].style.fontSize = fs.t + 'px';
  parts[2].style.fontSize = fs.s + 'px';
  parts.forEach((p, i) => tracks.push({ e: p, fn: t => life(t, a + .15 + i * .13, b - (2 - i) * .04, { dy: 36, s0: 1, din: .8 }) }));
}

// ---------- Scène 0 : ouverture ----------
const SCOLIA_SVG = `<svg viewBox="40 40 432 432" width="100%" height="100%"><g fill="none" stroke-width="62" stroke-linecap="round" stroke-linejoin="round">
  <path id="lp1" d="M330 118 H206 Q148 118 148 176 Q148 234 206 234 H226" stroke="#1D4ED8"/>
  <path id="lp2" d="M286 278 H306 Q364 278 364 336 Q364 394 306 394 H182" stroke="#16A34A"/></g>
  <circle id="lc1" cx="418" cy="118" r="38" fill="#1D4ED8"/><circle id="lc2" cx="94" cy="394" r="38" fill="#16A34A"/></svg>`;
function logoBlock(size, y, a, b, intro) {
  const box = el('div', 'abs');
  box.style.width = box.style.height = size + 'px';
  const card = el('div', '', box);
  Object.assign(card.style, { position: 'absolute', inset: '0', background: '#fff', borderRadius: (size * .23) + 'px',
    boxShadow: '0 30px 70px rgba(29,78,216,.18), 0 8px 20px rgba(17,24,39,.08), 0 0 0 1px rgba(0,0,0,.04)' });
  const inner = el('div', '', box, SCOLIA_SVG.replace(/id="(l\w+)"/g, `class="$1"`));
  Object.assign(inner.style, { position: 'absolute', left: (size * .17) + 'px', top: (size * .17) + 'px', width: (size * .66) + 'px', height: (size * .66) + 'px' });
  const p1 = inner.querySelector('.lp1'), p2 = inner.querySelector('.lp2'), c1 = inner.querySelector('.lc1'), c2 = inner.querySelector('.lc2');
  const L1 = p1.getTotalLength(), L2 = p2.getTotalLength();
  p1.style.strokeDasharray = L1; p2.style.strokeDasharray = L2;
  [c1, c2].forEach(c => { c.style.transformBox = 'fill-box'; c.style.transformOrigin = 'center'; });
  tracks.push({ e: box, fn: t => {
    const st = life(t, a, b, { dy: intro ? 0 : 40, s0: intro ? .6 : .9, din: intro ? 1.1 : .8, os: intro ? .08 : 0, oy: intro ? 0 : 30 });
    const d = intro ? a + .35 : a + .2;
    p1.style.strokeDashoffset = L1 * (1 - easeInOut((t - d) / .9));
    p2.style.strokeDashoffset = L2 * (1 - easeInOut((t - d - .35) / .9));
    c1.style.transform = `scale(${easeOut((t - d - .75) / .45)})`;
    c2.style.transform = `scale(${easeOut((t - d - 1.1) / .45)})`;
    return st;
  } });
  box.style.left = (W / 2 - size / 2) + 'px'; box.style.top = y + 'px';
}
function centeredText(html, y, size, weight, color, a, b, opt = {}) {
  const e = el('div', 'abs center', stage, html);
  Object.assign(e.style, { width: W + 'px', fontSize: size + 'px', fontWeight: weight, color, letterSpacing: opt.ls || '-.02em', lineHeight: 1.25 });
  track(e, 0, y, t => life(t, a, b, { dy: 30, s0: 1, din: .8, ...opt }));
  return e;
}

// Ouverture
{
  const a = 0, b = 4.4, cy = V ? 640 : 250, size = V ? 300 : 250;
  logoBlock(size, cy, a, b, true);
  centeredText('SCOLIA <span style="color:#1D4ED8">Pro</span>', cy + size + (V ? 70 : 55), V ? 120 : 108, 800, '#1d1d1f', 1.35, b, { ls: '-.035em', os: .03 });
  centeredText('La gestion scolaire, simple et sûre.', cy + size + (V ? 230 : 195), V ? 44 : 40, 500, '#515154', 1.75, b, { os: .02 });
}

// ---------- Scène 1 : encaisser ----------
{
  const a = 4.1, b = 10.6;
  caption('Caisse', '#34c759', 'Encaissez en quelques secondes.', 'Choisissez les mois, encaissez, imprimez le reçu numéroté avec son QR code.', a, b);
  const ww = V ? 1000 : 1060;
  const w = windowFrame(ww, ['d-encaisser.png', 'd-journal.png']);
  const x = V ? (W - ww) / 2 : 770, y = V ? 760 : (H - w.h) / 2;
  track(w.e, x, y, t => { crossfade(w.imgs, t, [7.4]); return life(t, a, b, { dy: 90, din: 1.1 }); });
  w.imgs.forEach(i => i.style.transformOrigin = '30% 20%');
  tracks.push({ e: w.imgs[1], fn: t => ({ o: clamp((t - 7.4) / .6), s: lerp(1.03, 1, easeOut((t - 7.4) / 2.5)) }) });
  if (V) {
    chip(110, 1470, 'receipt', '#34c759', 'Reçu RC-2026-000316', 'MASIALA KANKU Jonathan · 55 000 FC', a + 3.6, b, { scale: 1.3 });
    chip(260, 1640, 'qr', '#007aff', 'Code de vérification', '51PV44XX6B', a + 4.1, b, { scale: 1.3 });
  } else {
    chip(700, y + w.h - 70, 'receipt', '#34c759', 'Reçu RC-2026-000316', 'MASIALA KANKU Jonathan · 55 000 FC', a + 3.6, b);
    chip(1560, y - 34, 'qr', '#007aff', 'Code de vérification', '51PV44XX6B', a + 4.1, b);
  }
}

// ---------- Scène 2 : tableau de bord ----------
{
  const a = 10.3, b = 16.6;
  caption('Pilotage', '#007aff', 'Tout l’établissement d’un coup d’œil.', 'Recettes, recouvrement, retards et suivi de chaque mois, à jour à chaque reçu.', a, b);
  const ww = V ? 1000 : 1060;
  const w = windowFrame(ww, ['d-tableau.png', 'd-suivi.png']);
  const x = V ? (W - ww) / 2 : 770, y = V ? 760 : (H - w.h) / 2;
  w.imgs[0].style.transformOrigin = '60% 70%';
  tracks.push({ e: w.imgs[0], fn: t => ({ s: lerp(1, 1.05, easeInOut((t - a) / 3.4)) }) });
  track(w.e, x, y, t => { crossfade(w.imgs, t, [13.6]); return life(t, a, b, { dy: 90, din: 1.1 }); });

// ---------- Rendu d'une image ----------
window.render = function (t) {
  background(t);
  for (const k of tracks) {
    const st = k.fn(t);
    if (st) apply(k.e, st);
  }
};
window.ready = async function () {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  return { W, H, DURATION };
};
render(Number(new URLSearchParams(location.search).get('t') || 0));
