services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    networks: [relay]
  tls:
    image: caddy:2
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Renseigner le domaine du relais}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    networks: [relay]
networks:
  relay:
volumes:
  tls_data:
  tls_config:
